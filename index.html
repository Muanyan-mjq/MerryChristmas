   ============================================================ */
function createCache(i) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(W * scale * dpr));
  cv.height = Math.max(1, Math.round(H * scale * dpr));
  const c = cv.getContext('2d');
  c.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  caches[i] = { canvas: cv, ctx: c, idx: 0, ready: false };
  return caches[i];
}

function renderCacheNow(i) {
  if (caches[i] && caches[i].ready) return;
  const item = caches[i] || createCache(i);
  const theme = THEMES[i];
  item.ctx.clearRect(0, 0, W, H);
  paintBase(item.ctx, theme, 1, 1);
  paintBodies(item.ctx, theme, null);
  for (let k = 0; k < strokes.length; k++) {
    paintStroke(item.ctx, strokes[k], theme, 1, false);
  }
  item.idx = strokes.length;
  item.ready = true;
}

// 性能模式下只保留「当前主题 + 下一个主题」两张离屏画布
function cacheWindow() {
  if (perf.mode !== 'on') {
    const all = [];
    for (let i = 0; i < THEMES.length; i++) all.push(i);
    return all;
  }
  return [themeState.cur, (themeState.cur + 1) % THEMES.length];
}

function kickCaches() {
  cacheQueue.length = 0;
  const keep = cacheWindow();
  for (const i of keep) {
    if (!caches[i] || !caches[i].ready) cacheQueue.push(i);
  }
  if (perf.mode === 'on') {
    for (let i = 0; i < THEMES.length; i++) {
      if (keep.indexOf(i) < 0) caches[i] = null;
    }
  }
}

function pumpCaches(budgetMs) {
  if (!cacheQueue.length) return;
  const i = cacheQueue[0];
  const item = caches[i] || createCache(i);
  if (item.idx === 0) {
    item.ctx.clearRect(0, 0, W, H);
    paintBase(item.ctx, THEMES[i], 1, 1);
    paintBodies(item.ctx, THEMES[i], null);
  }
  const t0 = performance.now();
  while (item.idx < strokes.length && performance.now() - t0 < budgetMs) {
    paintStroke(item.ctx, strokes[item.idx], THEMES[i], 1, false);
    item.idx++;
  }
  if (item.idx >= strokes.length) {
    item.ready = true;
    cacheQueue.shift();
    themeState.ready = caches[themeState.cur] && caches[themeState.cur].ready;
  }
}


function currentTheme() {
  if (trans) {
    const p = easeInOut(clamp((vt - trans.t0) / trans.dur, 0, 1));
    return mixTheme(THEMES[trans.from], THEMES[trans.to], p);
  }
  return THEMES[themeState.cur];
}

function startTransition(target) {
  if (target < 0 || target >= THEMES.length) return;
  if (vt < CONFIG.totalDuration) return;
  if (!caches[target] || !caches[target].ready) renderCacheNow(target);
  if (!fullFor(target, false)) buildScarfFull(target);
  if (!trans && target === themeState.cur) return;
  let from = themeState.cur;
  if (trans) {
    const p = clamp((vt - trans.t0) / trans.dur, 0, 1);
    from = p < 0.5 ? trans.from : trans.to;
    if (!caches[from] || !caches[from].ready) from = themeState.cur;
  }
  trans = {
    from, to: target, t0: vt,
    dur: reduce ? CONFIG.theme.fadeReduced : (perf.mode === 'on' ? 2.4 : CONFIG.theme.fade)
  };
  themeState.cur = target;
  nextSwitchAt = vt + CONFIG.theme.manualHold;
  updateThemeUI();
}

/* 手机性能模式：自动检测 */
function detectPerf() {
  if (CONFIG.perfMode === 'on') { perf.mode = 'on'; }
  else if (CONFIG.perfMode === 'off') { perf.mode = 'off'; }
  else {
    const vw = Math.min(window.innerWidth, VW || window.innerWidth);
    const cores = navigator.hardwareConcurrency || 8;
    perf.mode = (vw < CONFIG.mobileBreakpoint || cores <= 4) ? 'on' : 'off';
  }
  perf.factor = perf.mode === 'on' ? 0.5 : 1;
}

function applyPerfLevel() {
  if (!flakes.length && !lights.length) return;
  if (perf.level >= 2) {
    flakes = flakes.filter((f, i) => i % 10 < 7);
    if (lights.length > 30) lights = lights.filter((l, i) => i % 10 < 7);
  }
}

/* ============================================================
   11. 主循环
   ============================================================ */
function advanceStrokes() {
  while (cursor < strokes.length && strokes[cursor].start <= vt) {
    active.push(strokes[cursor]);
    cursor++;
  }
  for (let i = active.length - 1; i >= 0; i--) {
    const s = active[i];
    if ((vt - s.start) / s.dur >= 1) {
      paintStroke(sceneCtx, s, THEMES[themeState.cur], 1, false);
      active.splice(i, 1);
    }
  }
}

function fillScene() {
  sceneCtx.clearRect(0, 0, W, H);
  for (const s of strokes) paintStroke(sceneCtx, s, THEMES[themeState.cur], 1, false);
  cursor = strokes.length;
  active.length = 0;
}

function viewRect() {
  // 可见区域在舞台逻辑坐标下的范围（舞台之外的留白也要有背景）
  return { x: -ox / scale, y: -oy / scale, w: VW / scale, h: VH / scale };
}

function drawBackground(themeNow) {
  const R0 = viewRect();
  ctx.fillStyle = themeNow.bg;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);

  const blobs = [
    { x: 0.18, y: 0.74, r: 0.62, c: themeNow.blobs[0] },
    { x: 0.84, y: 0.52, r: 0.58, c: themeNow.blobs[1] },
    { x: 0.70, y: 0.14, r: 0.52, c: themeNow.blobs[2] },
    { x: 0.10, y: 0.18, r: 0.42, c: themeNow.blobs[1] }
  ];
  for (const b of blobs) {
    const R = Math.max(R0.w, R0.h) * b.r;
    const bx = R0.x + R0.w * b.x;
    const by = R0.y + R0.h * b.y;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
    g.addColorStop(0, hexA(b.c, 0.42));
    g.addColorStop(1, hexA(b.c, 0));
    ctx.fillStyle = g;
    ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
  }

  // 远处的景深光斑，极慢地上下浮动
  const bok = [
    [0.10, 0.30, 58], [0.22, 0.16, 34], [0.78, 0.22, 62], [0.90, 0.42, 40],
    [0.06, 0.62, 48], [0.34, 0.72, 26], [0.66, 0.78, 52], [0.86, 0.70, 30],
    [0.16, 0.46, 22], [0.52, 0.10, 44], [0.94, 0.86, 36], [0.42, 0.34, 20],
    [0.74, 0.55, 24], [0.28, 0.56, 18]
  ];
  for (let i = 0; i < (perf.mode === 'on' ? 7 : bok.length); i++) {
    const bx = R0.x + R0.w * bok[i][0] + Math.sin(vt * 0.05 + i) * 12;
    const by = R0.y + R0.h * bok[i][1] + Math.cos(vt * 0.045 + i * 2) * 18;
    const br = bok[i][2] * clamp(R0.w / 1200, 0.7, 1.3);
    const col = themeNow.ornaments[i % 6];
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, hexA(col, 0.085));
    g.addColorStop(0.65, hexA(col, 0.045));
    g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
  }
}

let grainPattern = null;
function buildGrain() {
  const tile = document.createElement('canvas');
  const s = CONFIG.grain.tile;
  tile.width = tile.height = s;
  const g = tile.getContext('2d');
  const grng = mulberry32(9001);
  for (let i = 0; i < s * 1.4; i++) {
    const x = grng() * s, y = grng() * s;
    const a = 0.20 + grng() * 0.55;
    g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    g.fillRect(x, y, 1, 1);
  }
  grainPattern = ctx.createPattern(tile, 'repeat');
}

function drawGrain(themeNow) {
  if (!grainPattern) return;
  const R0 = viewRect();
  ctx.save();
  ctx.globalAlpha = themeNow.grain;
  ctx.fillStyle = grainPattern;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
  ctx.restore();

  const g = ctx.createRadialGradient(
    R0.x + R0.w * 0.5, R0.y + R0.h * 0.46, Math.min(R0.w, R0.h) * 0.28,
    R0.x + R0.w * 0.5, R0.y + R0.h * 0.5, Math.max(R0.w, R0.h) * 0.78
  );
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = g;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
}

function updateThemeUI() {
  const dots = document.querySelectorAll('#themes .dot');
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === themeState.cur || i === themeState.pending);
    d.disabled = false;                 // 作画期间也可点，先记下目标主题
  });
  const autoBtn = document.getElementById('auto');
  autoBtn.classList.toggle('off', !themeState.auto);
  autoBtn.textContent = themeState.auto ? '自动换色' : '自动换色 已关';
}

function autoTick() {
  if (!themeState.auto || reduce) return;
  if (vt < CONFIG.totalDuration) return;
  if (nextSwitchAt === null) {
    nextSwitchAt = CONFIG.totalDuration + CONFIG.text.delay + CONFIG.text.writeEn + CONFIG.text.hold + CONFIG.theme.firstHold;
  }
  if (vt < nextSwitchAt) return;
  let next = (themeState.cur + 1) % THEMES.length;
  if (!caches[next] || !caches[next].ready) {
    nextSwitchAt = vt + 1.0;
    return;
  }
  startTransition(next);
  nextSwitchAt = vt + CONFIG.theme.every;
}

function frame(ts) {
  const frameT0 = performance.now();
  if (!lastTs) lastTs = ts;
  let dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (document.hidden) dt = 0;          // 后台暂停，回到前台不追帧

  if (!reduce) vt += dt;
  else vt = CONFIG.totalDuration;

  if (vt >= CONFIG.totalDuration && !doneOnce) {
    doneOnce = true;
    kickCaches();
    updateThemeUI();
  }
  if (themeState.pending != null && vt >= CONFIG.totalDuration) {
    const target = themeState.pending;
    themeState.pending = null;
    startTransition(target);
    updateThemeUI();
  }

  if (trans) {
    const p = (vt - trans.t0) / trans.dur;
    if (p >= 1) {
      trans = null;
      updateThemeUI();
      kickCaches();
    }
  }

  const themeNow = currentTheme();
  root.style.setProperty('--bg', themeNow.bg);

  if (vt < CONFIG.totalDuration) advanceStrokes();

  // 整屏底色 → 舞台整体等比缩放
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = themeNow.bg;
  ctx.fillRect(0, 0, VW, VH);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);

  drawBackground(themeNow);
  drawSnow(themeNow, true);
  drawRibbonBack(themeNow);
  drawTreeLayer();
  drawMoundFront(themeNow);
  drawScarf(themeNow);
  drawOrnaments(themeNow);
  drawLights(themeNow);
  drawTopStar(themeNow);
  drawSnow(themeNow, false);
  drawGrain(themeNow);
  drawSignature(themeNow);
  if (CONFIG.debugLayout) drawDebugOverlay(themeNow);

  if (vt >= CONFIG.totalDuration) {
    autoTick();
    if (!trans) pumpCaches(5);
  }

  // 帧耗时监测：只降级一次，避免抖动
  perf.frames++;
  const ms = performance.now() - frameT0;
  perf.avgMs = perf.avgMs ? perf.avgMs * 0.9 + ms * 0.1 : ms;
  if (perf.mode === 'on' && perf.level === 1 && ms > 24) {
    perf.slow = (perf.slow || 0) + 1;
    if (perf.slow >= 30) { perf.level = 2; applyPerfLevel(); }
  } else if (ms <= 24) {
    perf.slow = 0;
  }

  requestAnimationFrame(frame);
}

function drawDebugOverlay(themeNow) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,0,120,.85)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.font = '14px monospace';
  ctx.fillText('view ' + VW + 'x' + VH + '  scale ' + scale.toFixed(3) + '  dpr ' + dpr.toFixed(2), 14, 26);
  ctx.fillText('perf ' + (perf.mode === 'on' ? 'ON' : 'off') + '  level ' + perf.level + '  ' + perf.avgMs.toFixed(1) + 'ms', 14, 46);
  ctx.restore();
}


/* ============================================================
   12. 交互
   ============================================================ */
const replayBtn = document.getElementById('replay');
const skipBtn = document.getElementById('skip');
const autoBtn = document.getElementById('auto');
const themesBox = document.getElementById('themes');
const dockEl = document.getElementById('dock');
const toastEl = document.getElementById('toast');
const toastText = document.getElementById('toastText');
const undoBtn = document.getElementById('undo');

THEMES.forEach((t, i) => {
  const d = document.createElement('button');
  d.type = 'button';
  d.className = 'dot';
  d.style.setProperty('--dot', t.treeMid);
  d.title = t.name;
  d.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    wakeDock();
    if (vt < CONFIG.totalDuration) { themeState.pending = i; updateThemeUI(); return; }
    startTransition(i);
  });
  themesBox.appendChild(d);
});

autoBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  themeState.auto = !themeState.auto;
  if (themeState.auto) nextSwitchAt = vt + CONFIG.theme.manualHold;
  updateThemeUI();
});

skipBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  if (vt >= CONFIG.totalDuration) return;
  vt = CONFIG.totalDuration;
  fillScene();
  doneOnce = true;
  kickCaches();
  updateThemeUI();
});

replayBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  // 立刻执行；保留上一帧完成态供撤销
  undoSnapshot = { vt: vt, done: doneOnce };
  trans = null;
  vt = 0;
  doneOnce = false;
  nextSwitchAt = null;
  latterReset();
  showToast('已重新作画');
});

undoBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  if (!undoSnapshot) return;
  vt = undoSnapshot.vt >= CONFIG.totalDuration ? CONFIG.totalDuration : CONFIG.totalDuration;
  trans = null;
  fillScene();
  doneOnce = true;
  kickCaches();
  updateThemeUI();
  hideToast();
});

let undoSnapshot = null;
let toastTimer = 0;
function showToast(text) {
  if (!toastEl) return;
  toastText.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), CONFIG.dock.undoToastMs);
}
function hideToast() {
  clearTimeout(toastTimer);
  if (toastEl) toastEl.classList.remove('show');
}

// dock 空闲淡出：手机上 5 秒无操作整体淡到 25%，任意触摸唤醒
let dockIdleTimer = 0;
function wakeDock() {
  themesBox.classList.remove('idle');
  controlsEl.classList.remove('idle');
  clearTimeout(dockIdleTimer);
  dockIdleTimer = setTimeout(() => {
    if (!isDockMobile()) return;
    themesBox.classList.add('idle');
    controlsEl.classList.add('idle');
  }, CONFIG.dock.dockIdleFade);
}
const controlsEl = document.getElementById('controls');
document.addEventListener('pointerdown', () => {
  wakeDock();
}, { passive: true });

function isDockMobile() {
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  return vw < CONFIG.dock.dockBreakpoint || vh < 500;
}

function latterReset() {
  sceneCtx.clearRect(0, 0, W, H);
  active.length = 0;
  cursor = 0;
  lastTs = 0;
  updateThemeUI();
}

let resizeTimer = 0;
function relayoutAll() {
  layout();                       // 只重算 scale / 画布尺寸，几何仍按固定舞台
  caches.length = 0;
  cacheQueue.length = 0;
  themeState.ready = false;
  trans = null;
  if (vt < CONFIG.totalDuration) vt = CONFIG.totalDuration;   // 重绘完成态，不重播动画
  fillScene();
  doneOnce = true;
  kickCaches();
  prepareText();
  scarfFulls.clear();
  kickScarfFull(themeState.cur);
  kickScarfFull((themeState.cur + 1) % THEMES.length);
  updateThemeUI();
}
function scheduleRelayout(delay) {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = Math.round(stage.clientWidth) || window.innerWidth;
    const h = Math.round(stage.clientHeight) || window.innerHeight;
    if (Math.abs(w - VW) < 2 && Math.abs(h - VH) < 2) return;  // 地址栏收缩等微小变化
    relayoutAll();
  }, delay || 150);
}
window.addEventListener('resize', () => scheduleRelayout(150));
window.addEventListener('orientationchange', () => scheduleRelayout(250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => scheduleRelayout(150));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastTs = 0;     // 回到前台重新对时，不追帧
});

/* ============================================================
   13. 启动
   ============================================================ */
const qs = new URLSearchParams(location.search);
if (qs.has('t')) themeState.cur = clamp(parseInt(qs.get('t'), 10) || 0, 0, THEMES.length - 1);
if (qs.get('auto') === '0') themeState.auto = false;
if (qs.get('debug') === '1') CONFIG.debugLayout = true;
detectPerf();
validateThemes();
layout();
buildAll();
buildDynamic();
ribbonSelfCheck();
prepareText();
buildGrain();
kickScarfFull(themeState.cur);
kickScarfFull((themeState.cur + 1) % THEMES.length);
updateThemeUI();
if (reduce) {
  vt = CONFIG.totalDuration;
  fillScene();
  doneOnce = true;
  kickCaches();
}
if (qs.has('vt')) {          // 调试：直接跳到某个时间点的完成态
  vt = clamp(parseFloat(qs.get('vt')) || CONFIG.totalDuration, 0, CONFIG.totalDuration);
  fillScene();
  doneOnce = true;
  kickCaches();
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
