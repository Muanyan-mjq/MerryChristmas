  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function shade(hex, k) {
  return k >= 0 ? mix(hex, '#ffffff', k * 0.18) : mix(hex, '#0a0a0a', -k * 0.22);
}
function isHex(v) { return typeof v === 'string' && v.charAt(0) === '#'; }

function srgbLin(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function srgbOut(v) { return 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(Math.max(0, v), 1 / 2.4) - 0.055); }
function hexOklab(h) {
  const [r, g, b] = hex2rgb(h);
  const R = srgbLin(r), Gg = srgbLin(g), B = srgbLin(b);
  const l = 0.4122214708 * R + 0.5363325363 * Gg + 0.0514459929 * B;
  const m = 0.2119034982 * R + 0.6806995451 * Gg + 0.1073969566 * B;
  const s = 0.0883024619 * R + 0.2817188376 * Gg + 0.6299787005 * B;
  const l1 = Math.cbrt(l), m1 = Math.cbrt(m), s1 = Math.cbrt(s);
  return {
    L: 0.2104542553 * l1 + 0.793617785 * m1 - 0.0040720468 * s1,
    a: 1.9779984951 * l1 - 2.428592205 * m1 + 0.4505937099 * s1,
    b: 0.0259040371 * l1 + 0.7827717662 * m1 - 0.808675766 * s1
  };
}
function oklabHex(L, a, b) {
  const l1 = L + 0.3963377774 * a + 0.2158037573 * b;
  const m1 = L - 0.1055613458 * a - 0.0638541728 * b;
  const s1 = L - 0.0894841775 * a - 1.291485548 * b;
  const l = l1 * l1 * l1, m = m1 * m1 * m1, s = s1 * s1 * s1;
  const R = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  const Gg = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  const B = -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s;
  return rgb2hex(srgbOut(clamp(R, 0, 1)), srgbOut(clamp(Gg, 0, 1)), srgbOut(clamp(B, 0, 1)));
}
function mixOK(a, b, t) {
  const A = hexOklab(a), B = hexOklab(b);
  return oklabHex(lerp(A.L, B.L, t), lerp(A.a, B.a, t), lerp(A.b, B.b, t));
}
function oklch(hex) {
  const o = hexOklab(hex);
  return { L: o.L, C: Math.hypot(o.a, o.b), h: Math.atan2(o.b, o.a) * 180 / Math.PI };
}

function mixTheme(a, b, t) {
  const out = {};
  for (const k in a) {
    const va = a[k], vb = b[k];
    if (isHex(va) && isHex(vb)) out[k] = mixOK(va, vb, t);
    else if (Array.isArray(va)) out[k] = va.map((v, i) => isHex(v) ? mixOK(v, vb[i], t) : lerp(v, vb[i], t));
    else if (typeof va === 'number') out[k] = lerp(va, vb, t);
    else out[k] = t < 0.5 ? va : vb;
  }
  return out;
}
function validateThemes() {
  for (const th of THEMES) {
    let main = th.ribbon[0], tries = 0;
    while (tries < 5) {
      const Lm = oklch(main).L, Lt = oklch(th.treeMid).L;
      if (Lm <= Lt - 0.22) break;
      main = oklabHex(oklch(main).L - 0.03, hexOklab(main).a, hexOklab(main).b);
      tries++;
    }
    if (tries > 0) {
      th.ribbon[0] = main;
      th.ribbon[1] = mixOK(main, th.ribbon[1], 0.85);
      th.ribbonDark = shade(main, -0.36);
      console.warn('[theme] ' + th.name + ' ribbon L lowered by ' + (tries * 0.03).toFixed(2));
    }
    const Cr = oklch(main).C, Ct = oklch(th.treeMid).C;
    if (Cr > Ct * 0.85) console.warn('[theme] ' + th.name + ' ribbon saturation ' + Cr.toFixed(3) + ' > tree ' + Ct.toFixed(3));
    const rh = oklch(main).h;
    th.ornaments = th.ornaments.map(function (o, i) {
      const oc = oklch(o);
      if (oc.C < 0.02) return o;
      let dh = Math.abs(((oc.h - rh + 540) % 360) - 180);
      dh = 180 - dh;
      if (dh < 25) {
        const nh = (oc.h + 35) * Math.PI / 180;
        const oo = hexOklab(o);
        console.warn('[theme] ' + th.name + ' ornament ' + i + ' hue rotated +35');
        return oklabHex(oo.L, oc.C * Math.cos(nh), oc.C * Math.sin(nh));
      }
      return o;
    });
  }
}

/* ============================================================
   3. 画布与状态
   ============================================================ */
const stage = document.getElementById('stage');
let ctx = stage.getContext('2d');
const root = document.documentElement;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, dpr = 1;
let VW = 0, VH = 0, scale = 1, ox = 0, oy = 0;
let sceneCanvas = document.createElement('canvas');
let sceneCtx = sceneCanvas.getContext('2d');
const scene = { canvas: sceneCanvas, ctx: sceneCtx };

// 围巾单独一张图层：所有部件同一进度、同一透明度
let scarfCanvas = document.createElement('canvas');
let scarfCtx = scarfCanvas.getContext('2d');

const perf = { mode: 'off', factor: 1, level: 1, frames: 0, avgMs: 0, hidden: false };

let G = {};
let strokes = [];
let active = [];
let cursor = 0;
let vt = 0;
let lastTs = 0;
let started = false;
let doneOnce = false;
let nextSwitchAt = null;

const themeState = { cur: 0, auto: !reduce, ready: false, pending: null };
let trans = null;
const caches = [];
const cacheQueue = [];

/* ============================================================
   4. 几何
   ============================================================ */
function layout() {
  // 可见尺寸（优先 visualViewport，避开手机地址栏）
  const vp = window.visualViewport;
  VW = Math.round((vp && vp.width) || stage.clientWidth || window.innerWidth) || 390;
  VH = Math.round((vp && vp.height) || stage.clientHeight || window.innerHeight) || 844;

  // 逻辑舞台固定，全部内容都按这套坐标绘制
  W = CONFIG.stage.width;
  H = CONFIG.stage.height;

  // 手机 dock：竖屏占底部，横屏占右侧；舞台只使用剩余区域
  const dockMobile = VW < CONFIG.dock.dockBreakpoint || VH < 500;
  const dockLand = dockMobile && VW > VH;
  document.body.classList.toggle('dock-mobile', dockMobile && !dockLand);
  document.body.classList.toggle('dock-land', dockLand);
  let availW = VW, availH = VH;
  if (dockMobile) {
    if (dockLand) {
      const dr = dockEl ? dockEl.getBoundingClientRect() : { width: CONFIG.dock.landscapeDockWidth };
      availW = Math.max(120, VW - Math.round(dr.width));
    } else {
      const dh = dockEl ? Math.round(dockEl.getBoundingClientRect().height) : 100;
      availH = Math.max(160, VH - dh);
    }
  }

  scale = Math.min(availW / W, availH / H);

  // dpr 上限，并按画布像素宽再收一次
  let dprCap = CONFIG.maxDpr;
  if (W * scale * dprCap > CONFIG.maxCanvasWidth) {
    dprCap = Math.max(1, CONFIG.maxCanvasWidth / (W * scale));
  }
  dpr = Math.min(window.devicePixelRatio || 1, dprCap);

  stage.width = Math.round(VW * dpr);
  stage.height = Math.round(VH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ox = (availW - W * scale) * 0.5;
  oy = (availH - H * scale) * 0.5;

  const sw = Math.max(1, Math.round(W * scale * dpr));
  const sh = Math.max(1, Math.round(H * scale * dpr));
  sceneCanvas.width = sw;
  sceneCanvas.height = sh;
  sceneCtx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  scarfCanvas.width = sw;
  scarfCanvas.height = sh;
  scarfCtx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  const Ht = H * CONFIG.tree.heightRatio;
  const width = Math.min(Ht / CONFIG.tree.widthRatio, W * 0.90);
  const halfW = width * 0.5;
  const cx = W * 0.5;
  const yBot = H * CONFIG.tree.treeBottom;
  const top = yBot - Ht;

  const trunkBot = yBot + Ht * (CONFIG.tree.trunkHeight + 0.020);
  const moundTop = trunkBot - Math.min(6, Ht * 0.010);
  G = { W, H, Ht, width, halfW, top, yBot, cx, trunkBot, moundTop, phone: false, shorty: false, layers: [] };

  const L = CONFIG.tree.layers;
  for (let i = 0; i < L; i++) {
    const f = i / (L - 1);
    const yb = top + Ht * (0.975 - 0.150 * i);
    const h = Ht * (0.360 - 0.030 * i);
    const hw = halfW * Math.pow(1 - 0.82 * f, 1.0);
    G.layers.push({ f, i, yBottom: yb, yTop: yb - h, h, hw });
  }
}

function envHalf(f) {
  return G.halfW * Math.pow(Math.max(0, 1 - 0.84 * f), 0.92);
}

/* ============================================================
   5. 笔触与队列
   ============================================================ */
function addBrush(role, x0, y0, x1, y1, o) {
  const w = o.w;
  const n = o.n || clamp(Math.round(w * 1.9), 2, perf.mode === 'on' ? Math.round(CONFIG.tree.bristles.max * 0.5) : CONFIG.tree.bristles.max);
  const bs = [];
  for (let j = 0; j < n; j++) {
    bs.push({
      off: rrand(-1, 1),
      wid: rrand(0.55, 1.45),
      a: rrand(0.45, 1.0),
      j: rrand(-1, 1)
    });
  }
  strokes.push({
    role, x0, y0, x1, y1, w,
    alpha: o.alpha == null ? 0.75 : o.alpha,
    tone: o.tone == null ? 0.5 : o.tone,
    bowX: o.bowX || 0,
    bowY: o.bowY || 0,
    start: o.start || 0,
    dur: o.dur || rrand(0.12, 0.3),
    taper: !!o.taper || w > 4,
    bs,
    ord: strokes.length
  });
}

function roleColor(theme, role, tone) {
  switch (role) {
    case 'shadow': return mix(theme.treeShadow, theme.bg, 0.46 + 0.16 * tone);
    case 'mid': return mix(theme.treeShadow, theme.treeMid, 0.40 + 0.30 * tone);
    case 'light': return mix(theme.treeMid, theme.treeLight, 0.18 + 0.30 * tone);
    case 'highlight': return theme.treeHighlight;
    case 'accent1': return theme.treeAccent1;
    case 'accent2': return theme.treeAccent2;
    case 'trunk': return mix(theme.trunk, theme.treeShadow, tone * 0.5);
    case 'snow': return mix(theme.snowA, theme.snowB, tone * 0.35);
    case 'moundShadow': return mix(theme.snowB, theme.treeShadow, tone * 0.35);
    default: return theme.treeMid;
  }
}

function paintStroke(c, s, theme, p, wet) {
  const t = clamp(p, 0, 1);
  if (t <= 0.001) return;
  const x1 = s.x0 + (s.x1 - s.x0) * t;
  const y1 = s.y0 + (s.y1 - s.y0) * t;
  const mx = (s.x0 + x1) * 0.5 + s.bowX * Math.sin(Math.PI * t);
  const my = (s.y0 + y1) * 0.5 + s.bowY * Math.sin(Math.PI * t);
  const dx = s.x1 - s.x0, dy = s.y1 - s.y0;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const base = roleColor(theme, s.role, s.tone);

  // 宽笔触：填充成“根部粗、尖端收窄”的锥形笔锋（圆头、无方角）
  if (s.taper) {
    const h0 = s.w * 0.5;
    const h1 = Math.max(0.7, s.w * 0.10);
    const hq = h0 * 0.82;
    const qx = s.x0 + (x1 - s.x0) * 0.62;
    const qy = s.y0 + (y1 - s.y0) * 0.62;
    const col = wet ? mix(base, '#ffffff', 0.16) : base;
    const x0a = s.x0 + nx * h0, y0a = s.y0 + ny * h0;
    const x0b = s.x0 - nx * h0, y0b = s.y0 - ny * h0;
    const xqa = qx + nx * hq, yqa = qy + ny * hq;
    const xqb = qx - nx * hq, yqb = qy - ny * hq;
    const x1a = x1 + nx * h1, y1a = y1 + ny * h1;
    const x1b = x1 - nx * h1, y1b = y1 - ny * h1;
    c.globalAlpha = clamp(s.alpha, 0, 1);
    c.fillStyle = col;
    c.beginPath();
    c.moveTo(x0a, y0a);
    c.quadraticCurveTo(mx + nx * h0, my + ny * h0, xqa, yqa);
    c.lineTo(x1a, y1a);
    c.lineTo(x1b, y1b);
    c.lineTo(xqb, yqb);
    c.quadraticCurveTo(mx - nx * h0, my - ny * h0, x0b, y0b);
    c.closePath();
    c.fill();
    c.globalAlpha = clamp(s.alpha * 0.28, 0, 1);
    for (let k = 1; k <= 4; k++) {
      const off = (k / 5 - 0.5) * s.w * 0.9;
      c.strokeStyle = shade(base, k % 2 ? -0.30 : 0.34);
      c.lineWidth = Math.max(0.6, s.w * 0.035);
      c.beginPath();
      c.moveTo(s.x0 + nx * off, s.y0 + ny * off);
      c.quadraticCurveTo(mx + nx * off, my + ny * off, x1 + nx * off, y1 + ny * off);
      c.stroke();
    }
    c.globalAlpha = 1;
    return;
  }

  for (let i = 0; i < s.bs.length; i++) {
    const b = s.bs[i];
    const off = b.off * s.w * 0.5;
    const lw = Math.max(0.55, s.w * b.wid * 0.16);
    let col = shade(base, b.j);
    if (wet) col = mix(col, '#ffffff', 0.18);
    c.globalAlpha = clamp(s.alpha * b.a * (wet ? 0.95 : 1), 0, 1);
    c.strokeStyle = col;
    c.lineWidth = lw;
    c.beginPath();
    c.moveTo(s.x0 + nx * off, s.y0 + ny * off);
    c.quadraticCurveTo(mx + nx * off, my + ny * off, x1 + nx * off, y1 + ny * off);
    c.stroke();
  }
  c.globalAlpha = 1;
}

/* ============================================================
   6. 树的结构与笔触生成
   ============================================================ */
function buildMound() {
  // 雪堆由 paintBase 一次画出，不再叠一堆灰笔触
  return;
}
function buildTrunk() {
  return;
  const { cx, yBot, Ht } = G;
  const tw = Ht * 0.042;
  for (let i = 0; i < 12; i++) {
    const u = rrand(-1, 1);
    addBrush('trunk', cx + u * tw * 0.5, yBot - Ht * rrand(0.02, 0.13),
      cx + u * tw * 0.6, yBot + Ht * 0.01, {
        w: rrand(0.006, 0.014) * Ht, alpha: rrand(0.4, 0.7),
        tone: rrand(0, 1), start: rrand(0.2, 1.1), dur: rrand(0.12, 0.26)
      });
  }
}

function buildLayer(layer) {
  const { cx } = G;
  const { i, yTop, yBottom, h, hw } = layer;
  const base = CONFIG.tree.treeStart + i * CONFIG.tree.layerGap;
  const win = CONFIG.tree.layerDur;
  const scaleW = 1 - i * 0.040;

  // 每层两排交错的主枝，避免“一整块裙摆”的平面感
  for (let r = 0; r < 3; r++) {
    const rowY = yTop + h * (0.10 + r * 0.21);
    const rowHalf = hw * (0.56 + r * 0.20);
    const perSide = 11;
    const rowStart = base + r * 0.20 * win;

    for (const side of [-1, 1]) {
      for (let k = 0; k < perSide; k++) {
        const frac = (k + 0.5) / perSide;
        const len = rowHalf * (0.50 + 0.52 * frac) * rrand(0.95, 1.08);
        const startX = cx + side * rrand(2, 12);
        const startY = rowY + h * rrand(-0.02, 0.035);
        const tipX = cx + side * len;
        const tipY = startY + h * rrand(0.20, 0.52);
        const bowX = side * len * rrand(0.03, 0.09);
        const bowY = h * rrand(0.035, 0.09);
        const dx = tipX - startX, dy = tipY - startY;
        const l = Math.hypot(dx, dy) || 1;
        const ux = dx / l, uy = dy / l;
        const nx = -uy, ny = ux;

        // 枝体：暗 → 中 → 亮，粗根收尖
        addBrush('shadow', startX, startY, tipX, tipY, {
          w: G.Ht * rrand(0.030, 0.044) * scaleW,
          alpha: rrand(0.80, 0.96), tone: rrand(0.04, 0.42),
          bowX, bowY,
          start: rowStart + 0.02 * win + rrand(0, 0.14) * win, dur: rrand(0.16, 0.32)
        });
        addBrush('mid', startX + nx * 4, startY + ny * 4,
          startX + dx * 0.94 + nx * 4, startY + dy * 0.94 + ny * 4, {
          w: G.Ht * rrand(0.020, 0.030) * scaleW,
          alpha: rrand(0.70, 0.92), tone: rrand(0.26, 0.62),
          bowX: bowX * 0.9, bowY: bowY * 0.9,
          start: rowStart + 0.14 * win + rrand(0, 0.14) * win, dur: rrand(0.14, 0.28)
        });
        addBrush('light', startX + nx * 8, startY + ny * 8,
          startX + dx * 0.78 + nx * 8, startY + dy * 0.78 + ny * 8, {
          w: G.Ht * rrand(0.010, 0.018) * scaleW,
          alpha: rrand(0.38, 0.62), tone: rrand(0.52, 0.82),
          bowX: bowX * 0.75, bowY: bowY * 0.75,
          start: rowStart + 0.25 * win + rrand(0, 0.14) * win, dur: rrand(0.12, 0.26)
        });

        // 枝尖的白色羽毛
        addBrush('highlight', tipX - ux * rrand(9, 20) * scaleW, tipY - uy * rrand(9, 20) * scaleW,
          tipX + ux * rrand(1, 6), tipY + uy * rrand(1, 6), {
            w: G.Ht * rrand(0.006, 0.013) * scaleW,
            alpha: rrand(0.40, 0.68), tone: 1,
            bowX: bowX * 0.3, bowY: bowY * 0.3,
            start: rowStart + 0.34 * win + rrand(0, 0.12) * win, dur: rrand(0.10, 0.20)
          });

        // 枝下沿散开的针叶簇：把“桨叶”边缘打碎成羽毛
        for (let q = 0; q < 5; q++) {
          const t = 0.38 + q * 0.135 + rrand(-0.04, 0.04);
          const px = startX + dx * t + nx * (G.Ht * 0.012);
          const py = startY + dy * t + ny * (G.Ht * 0.012);
          const hang = side === 1 ? rrand(0.50, 1.05) : Math.PI - rrand(0.50, 1.05);
          const fl = G.Ht * rrand(0.016, 0.038) * scaleW;
          addBrush(q % 2 ? 'mid' : 'light', px, py, px + Math.cos(hang) * fl, py + Math.sin(hang) * fl, {
            w: G.Ht * rrand(0.007, 0.015) * scaleW,
            alpha: rrand(0.42, 0.78), tone: rrand(0.3, 0.95),
            bowX: Math.cos(hang) * fl * 0.14, bowY: fl * 0.18,
            start: rowStart + (0.26 + q * 0.03) * win + rrand(0, 0.10) * win,
            dur: rrand(0.10, 0.20)
          });
        }

        // 枝上侧一小撮向上翘的针叶，打破直线
        const upA = Math.atan2(dy, dx) - 0.55 + rrand(-0.15, 0.15);
        const upLen = G.Ht * rrand(0.012, 0.030) * scaleW;
        addBrush('light',
          startX + dx * rrand(0.5, 0.8), startY + dy * rrand(0.5, 0.8),
          startX + dx * rrand(0.5, 0.8) + Math.cos(upA) * upLen,
          startY + dy * rrand(0.5, 0.8) + Math.sin(upA) * upLen, {
            w: G.Ht * rrand(0.006, 0.013) * scaleW,
            alpha: rrand(0.35, 0.62), tone: rrand(0.5, 1),
            start: rowStart + 0.30 * win + rrand(0, 0.14) * win,
            dur: rrand(0.10, 0.22)
          });
      }
    }
  }

  // 中轴横跨笔触：把左右两半在中线附近互相越过，消掉 V 形缝
  for (let q = 0; q < 6; q++) {
    const yy = yTop + h * rrand(0.34, 0.90);
    const half = hw * rrand(0.16, 0.34);
    addBrush(q % 3 === 0 ? 'mid' : 'light',
      cx - half, yy,
      cx + half, yy + rrand(-9, 9), {
      w: G.Ht * rrand(0.012, 0.024) * scaleW,
      alpha: rrand(0.50, 0.85), tone: rrand(0.38, 0.92),
      bowX: rrand(-8, 8), bowY: rrand(2, 9),
      start: base + 0.45 * win + rrand(0, 0.12) * win,
      dur: rrand(0.16, 0.26)
    });
  }

  // 层间只有外侧 1/3 允许透出一点阴影缝隙，用短暗针叶填出肌理
  const gaps = 7;
  for (let q = 0; q < gaps; q++) {
    if (rng() > 0.62) continue;
    const side = rng() < 0.5 ? -1 : 1;
    const u = side * rrand(0.60, 0.96);
    const gx = cx + u * hw;
    const gy = yTop + h * rrand(0.01, 0.10);
    addBrush('shadow', gx, gy, gx + side * rrand(4, 16), gy + rrand(9, h * 0.10), {
      w: G.Ht * rrand(0.006, 0.012) * scaleW,
      alpha: rrand(0.45, 0.72), tone: rrand(0.1, 0.5),
      start: base + 0.18 * win + rrand(0, 0.10) * win,
      dur: rrand(0.10, 0.18)
    });
  }

  // 中轴竖向覆盖：一排短横向针叶，压住轴线上残留的深缝
  for (let q = 0; q < 8; q++) {
    const yy = yTop + h * (0.22 + q * 0.095);
    const hwq = hw * 0.16;
    addBrush(q % 2 ? 'mid' : 'light', cx - hwq, yy, cx + hwq * rrand(0.8, 1.3), yy + rrand(-4, 4), {
      w: G.Ht * rrand(0.024, 0.038) * scaleW,
      alpha: rrand(0.55, 0.88), tone: rrand(0.45, 0.95),
      start: base + 0.40 * win + q * 0.012,
      dur: 0.18
    });
  }

  // 最下层向下延伸压到雪丘，盖住树干与深色底座
  if (i === 0) {
    for (let q = 0; q < 22; q++) {
      const x = cx + rrand(-0.42, 0.42) * hw;
      const y = yBottom - h * rrand(0.02, 0.10);
      addBrush(q % 3 === 0 ? 'shadow' : (q % 2 ? 'mid' : 'light'), x, y, x + rrand(-10, 10), G.yBot + H * 0.004, {
        w: H * rrand(0.010, 0.022),
        alpha: rrand(0.55, 0.9), tone: rrand(0.2, 0.8),
        bowX: rrand(-4, 4), bowY: rrand(2, 8),
        start: base + 0.55 * win + q * 0.015,
        dur: rrand(0.16, 0.28)
      });
    }
  }
}

function buildLayerShapes() {
  G.layers.forEach((L, i) => {
    const rr = mulberry32(CONFIG.seed + 1301 + i * 73);
    const edge = [];
    const N = 26;
    for (let j = 0; j <= N; j++) {
      const u = -1 + 2 * j / N;
      const jitter = rr() * L.h * 0.055 - L.h * 0.015;
      const saw = Math.sin(j * 2.4 + i * 1.7) * L.h * 0.035;
      edge.push({ x: G.cx + u * L.hw, y: L.yBottom + jitter + saw });
    }
    L.edge = edge;
  });
}

function paintBodies(c, theme, alphaFor) {
  // 只在中轴附近垫一层深色“树心”，挡住枝与枝之间的透光，不铺满整个轮廓
  for (const L of G.layers) {
    const a = alphaFor ? alphaFor(L.i) : 1;
    if (a <= 0.01) continue;
    const g = c.createLinearGradient(0, L.yTop, 0, L.yBottom);
    g.addColorStop(0, mix(theme.treeShadow, theme.treeMid, 0.20));
    g.addColorStop(0.50, mix(theme.treeShadow, theme.treeMid, 0.42));
    g.addColorStop(0.86, mix(theme.treeShadow, theme.treeMid, 0.62));
    g.addColorStop(1, mix(theme.treeShadow, theme.treeMid, 0.42));
    c.globalAlpha = a;
    c.fillStyle = g;
    const innerBottom = L.yBottom + L.h * 0.07;
    c.beginPath();
    c.moveTo(G.cx - L.hw * 0.07, L.yTop);
    c.lineTo(G.cx + L.hw * 0.07, L.yTop);
    c.lineTo(G.cx + L.hw * 0.48, innerBottom);
    c.lineTo(G.cx - L.hw * 0.48, innerBottom);
    c.closePath();
    c.fill();
    c.globalAlpha = 1;
  }
  c.globalAlpha = 1;
}

function buildAll() {
  rng = mulberry32(CONFIG.seed);
  strokes = [];
  active = [];
  cursor = 0;
  buildLayerShapes();
  buildMound();
  buildTrunk();
  G.layers.forEach(buildLayer);
  strokes.sort((a, b) => (a.start - b.start) || (a.ord - b.ord));
  buildEnvelope();
}

// 把整棵树先完整画一遍，再按行扫描真实轮廓，供丝带定位
function buildEnvelope() {
  const cv = document.createElement('canvas');
  cv.width = Math.round(G.W);
  cv.height = Math.round(G.H);
  const c = cv.getContext('2d');
  const th = THEMES[0];
  paintBodies(c, th, function () { return 1; });
  for (const s of strokes) {
    if (s.role === 'snow' || s.role === 'moundShadow') continue;
    paintStroke(c, s, th, 1, false);
  }

  const rows = [];
  for (let y = Math.floor(G.top); y <= Math.floor(G.yBot); y += 3) {
    const data = c.getImageData(0, y, cv.width, 1).data;
    let xL = -1, xR = -1;
    for (let x = 0; x < cv.width; x++) {
      if (data[x * 4 + 3] > 90) { if (xL < 0) xL = x; xR = x; }
    }
    if (xL < 0) continue;
    rows.push({ y, xL, xR });
  }

  // 9 行移动平均
  const sm = rows.map((r, i) => {
    let a = 0, b = 0, n = 0;
    for (let k = -4; k <= 4; k++) {
      const t = rows[i + k];
      if (!t) continue;
      a += t.xL; b += t.xR; n++;
    }
    return { y: r.y, xL: a / n, xR: b / n };
  });
  G.envRows = sm;
  G.treeBaseY = sm.length ? sm[sm.length - 1].y : (G.yBot - G.Ht * 0.025);
}

function envAt(y) {
  const rows = G.envRows;
  if (!rows || !rows.length) return { half: G.halfW * 0.7, cx: G.cx };
  if (y <= rows[0].y) return { half: (rows[0].xR - rows[0].xL) * 0.5, cx: (rows[0].xR + rows[0].xL) * 0.5 };
  const last = rows[rows.length - 1];
  if (y >= last.y) return { half: (last.xR - last.xL) * 0.5, cx: (last.xR + last.xL) * 0.5 };
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (y >= a.y && y <= b.y) {
      const k = (y - a.y) / (b.y - a.y);
      const xL = a.xL + (b.xL - a.xL) * k;
      const xR = a.xR + (b.xR - a.xR) * k;
      return { half: (xR - xL) * 0.5, cx: (xR + xL) * 0.5 };
    }
  }
  return { half: G.halfW * 0.7, cx: G.cx };
}

/* ============================================================
   7. 动态元素（彩带、圆点、星星、雪、文字）
   ============================================================ */
let ribbon = null;
let ornaments = [];
let lights = [];
let flakes = [];
let starTop = {};
let textLines = [];

function buildDynamic() {
  rng = mulberry32(CONFIG.seed + 7717);
  const { cx, top, Ht } = G;

  // 丝带：真 3D 缠绕带——中心点沿圆锥面走，带面上下沿只做竖直偏移
  ribbon = { samples: [], turns: CONFIG.ribbon.turns, th0: 1.26, tailPhase: rrand(0, TAU) };
  const turns = ribbon.turns;
  const topY = top + Ht * 0.062;      // 收在星星下方
  const botY = top + Ht * 0.935;
  const stepAng = 1.5 * Math.PI / 180;
  const span = turns * TAU;
  const M = Math.round(span / stepAng);
  const bandBoost = clamp(CONFIG.ribbon.ribbonMinWidthPx / (19 * (scale || 1)), 1, CONFIG.ribbon.ribbonMaxWidthPx / 36);
  for (let k = 0; k <= M; k++) {
    const t = k / M;
    const theta = ribbon.th0 + span * t;
    const yBase = botY - (botY - topY) * t;
    const env = envAt(yBase);
    const sinT = Math.sin(theta), cosT = Math.cos(theta);
    const order = clamp(Math.floor((theta - ribbon.th0) / TAU), 0, turns - 1);   // 0 = 最下圈
    const fitR = CONFIG.ribbon.ribbonFitRadius[clamp(3 - order, 0, 4)] || 0.985;
    let R = env.half * fitR - CONFIG.ribbon.ribbonSink;                                // 往树里压 2px
    let x = env.cx + R * sinT;
    const lim = env.half * 0.99;
    if (Math.abs(x - env.cx) > lim) {          // 只缩小半径，带宽不变
      R = lim / Math.max(0.0001, Math.abs(sinT));
      x = env.cx + R * sinT;
    }
    // 更平整：带宽 ±2%，中线 ±0.5px
    // 等带宽：只有名义宽度 × 扭折系数 × ±2% 起伏，不掺任何透视收窄
    const wB = CONFIG.ribbon.ribbonWidthBottom, wT = CONFIG.ribbon.ribbonWidthTop;
    const wNom = wB + (wT - wB) * t;
    let w = wNom * bandBoost * (1 + 0.02 * Math.sin(theta * 2.1 + 1.3));
    if (w < wNom * 0.82) w = wNom;         // 硬约束：不得出现细线
    const tilt = (0.10 + 0.06 * (1 - t)) * 0.9;
    const sag = (1.5 + 1.5 * (1 - t)) * Math.pow(Math.max(0, cosT), 1.6);
    const y = yBase + R * tilt * cosT + sag + Math.sin(theta * 1.9 + 0.5) * 0.5;
    ribbon.samples.push({ t, theta, x, y, cos: cosT, sin: sinT, w, R });
  }
  // 相邻采样点中线距离 ≤ 3px：过远就插值加密，保证四边形连续无缝
  {
    const src = ribbon.samples.slice();
    const out = [];
    for (let k = 0; k < src.length - 1; k++) {
      const a = src[k], b = src[k + 1];
      out.push(a);
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      const n = Math.min(4, Math.max(0, Math.ceil(d / CONFIG.ribbon.ribbonMaxSampleGap) - 1));
      for (let j = 1; j <= n; j++) {
        const u = j / (n + 1);
        out.push({
          t: a.t + (b.t - a.t) * u,
          theta: a.theta + (b.theta - a.theta) * u,
          x: a.x + (b.x - a.x) * u,
          y: a.y + (b.y - a.y) * u,
          cos: a.cos + (b.cos - a.cos) * u,
          sin: a.sin + (b.sin - a.sin) * u,
          w: a.w + (b.w - a.w) * u,
          R: a.R + (b.R - a.R) * u
        });
      }
    }
    out.push(src[src.length - 1]);
    ribbon.samples = out;
  }
  // 弧长，用来排布虚线缝线
  let acc = 0;
  ribbon.samples[0].s = 0;
  for (let k = 1; k < ribbon.samples.length; k++) {
    const a = ribbon.samples[k - 1], b = ribbon.samples[k];
    acc += Math.hypot(b.x - a.x, b.y - a.y);
    b.s = acc;
  }
  ribbon.M = M;
  ribbon.topY = topY;
  ribbon.botY = botY;

  // 前景针叶压边：把围巾边缘盖住一点，像嵌在枝叶里
  ribbon.needles = [];
  const ndN = perf.mode === 'on' ? 16 : 22;
  const ndCand = [];
  for (let i = 0; i < ribbon.samples.length; i++) {
    if (ribbon.samples[i].cos > 0.35) ndCand.push(i);
  }
  for (let n = 0; n < ndN && ndCand.length; n++) {
    const idx = ndCand[Math.floor(rng() * ndCand.length)];
    const a = ribbon.samples[idx];
    const dir = n % 2 ? 1 : -1;
    const long = n % 5 === 0;
    ribbon.needles.push({
      x: a.x + (rng() - 0.5) * a.w * 0.6,
      y: a.y + dir * a.w * 0.5,
      dx: (rng() - 0.5) * 5,
      dy: -dir * (long ? 8 + rng() * 6 : 2 + rng() * 3),
      w: 1.1 + rng() * 0.7,
      bright: rng() > 0.55,
      cos: a.cos,
      sNorm: idx / Math.max(1, ribbon.samples.length - 1)
    });
  }
  // 上边缘的小雪堆（避开条纹）
  ribbon.snowCaps = [];
  const capCount = perf.mode === 'on' ? 3 : (5 + Math.floor(rng() * 4));
  const caps = [];
  for (let i = 0; i < ribbon.samples.length; i++) {
    const a = ribbon.samples[i];
    if (a.cos < 0.55) continue;
    if (ribbonInStripe(a.theta, 4.5)) continue;
    caps.push(i);
  }
  for (let c = 0; c < capCount && caps.length; c++) {
    const idx = caps[Math.floor(rng() * caps.length)];
    const a = ribbon.samples[idx];
    ribbon.snowCaps.push({
      x: a.x,
      y: a.y - a.w * 0.5,
      rx: (8 + rng() * 12) * clamp(Ht / 620, 0.7, 1.2),
      ry: 2 + rng() * 2,
      ph: rng() * TAU
    });
  }

  // 装饰：全部挂到各层下沿的羽毛尖端下方，不再挂在丝带上
  ornaments = [];
  const types = ['ball', 'drop', 'flake', 'bell', 'star'];
  const typeSeq = ['ball', 'ball', 'drop', 'ball', 'flake', 'star', 'ball', 'bell', 'drop', 'star', 'ball', 'flake', 'ball', 'drop', 'star'];
  let oi = 0;
  for (let i = 0; i < G.layers.length; i++) {
    const L = G.layers[i];
    if (!L.edge) continue;
    const count = i < 2 ? 6 : (i < 4 ? 5 : 3);
    const rBase = clamp((9.8 - i * 1.0) * clamp(Ht / 520, 0.78, 1.35), 3.0, 10.5);
    for (let k = 0; k < count; k++) {
      const u = (k + 0.5) / count;
      const tip = L.edge[Math.max(0, Math.min(L.edge.length - 1, Math.round(u * (L.edge.length - 1))))];
      const r = rBase * rrand(0.92, 1.08);
      ornaments.push({
        ax: tip.x, ay: tip.y + rrand(2, 4),
        len: clamp(rrand(6, 22), 4, Math.max(4, (G.moundTop || G.treeBaseY || G.yBot) - (tip.y + 2) - 10)),
        r,
        type: typeSeq[oi % typeSeq.length],
        color: (oi * 3 + i) % 6,
        start: 9.0 + (5 - i) * 0.42 + u * 0.30 + rrand(-0.04, 0.04),
        phase: rrand(0, TAU),
        period: rrand(3.2, 5.0),
        amp: rrand(1.4, 2.8),
        tier: i
      });
      oi++;
    }
  }

  // 灯泡：沿每层下沿的羽毛尖端排布
  lights = [];
  for (let i = 0; i < G.layers.length; i++) {
    const L = G.layers[i];
    if (!L.edge) continue;
    const n = 13;
    for (let k = 0; k < n; k++) {
      const u = (k + 0.5) / n;
      const tip = L.edge[Math.max(0, Math.min(L.edge.length - 1, Math.round(u * (L.edge.length - 1))))];
      lights.push({
        x: tip.x, y: tip.y + 2,
        r: rrand(1.5, 2.8) * clamp(Ht / 520, 0, 1.3),
        phase: rrand(0, TAU),
        period: rrand(2.5, 6),
        color: (k + i) % 6,
        spark: rng() < (perf.mode === 'on' ? 0.30 : 0.15),
        tier: i,
        on: 0
      });
    }
  }
  starTop = { x: cx, y: top + Ht * 0.022, R: Math.min(G.width * 0.062, Ht * 0.055), start: 11.15 };

  // 雪
  flakes = [];
  const count = Math.round(CONFIG.snow.count * 0.62 * (perf.mode === 'on' ? 0.5 : 1));
  for (let i = 0; i < count; i++) {
    const tier = i < count * 0.62 ? 0 : (i < count * 0.88 ? 1 : 2);
    const r = tier === 0 ? rrand(1.0, 2.0) : (tier === 1 ? rrand(2.5, 4.5) : rrand(5, 9));
    flakes.push({
      x: rrand(-40, W + 40),
      y: rrand(-60, H + 60),
      r,
      tier,
      back: i < count * CONFIG.snow.backRatio,
      speed: (tier === 0 ? rrand(7, 16) : (tier === 1 ? rrand(16, 30) : rrand(34, 56))),
      sway: rrand(4, 16),
      swayW: rrand(0.5, 1.3),
      phase: rrand(0, TAU),
      rot: rrand(0, TAU),
      spin: rrand(-0.35, 0.35),
      sides: 4 + Math.floor(rng() * 2),
      tint: rng() < 0.18 ? rrand(0.35, 1) : 0,
      start: rrand(11.9, 14.9)
    });
  }

  // 性能模式：灯泡数量上限 50
  if (perf.mode === 'on' && lights.length > 50) lights.length = 50;
}

/* ============================================================
   8. 文字排版 + 骨架追踪（真正的“书写”而非描边）
   ============================================================ */
const FONT_EN = 'italic 1px "Snell Roundhand","Apple Chancery","Segoe Script","Lucida Handwriting","Bradley Hand","Brush Script MT",cursive';
const FONT_JP = '1px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS Mincho",serif';
const FONT_ZH = '1px "Songti SC","STSong","Noto Serif SC","SimSun",serif';

let glyphVersion = 0;
let glyphQueue = [];

function prepareText() {
  const mctx = document.createElement('canvas').getContext('2d');
  glyphVersion++;
  glyphQueue.length = 0;
  const maxW = W * CONFIG.text.textMaxWidthRatio;
  const minPx = (VW < CONFIG.dock.dockBreakpoint) ? CONFIG.text.textMinPxMobile : CONFIG.text.textMinPxDesktop;

  textLines = CONFIG.text.lines.map(line => {
    const str = line.text + ' ' + line.name;
    const family = line.font === 'en' ? FONT_EN : (line.font === 'jp' ? FONT_JP : FONT_ZH);
    let size = line.font === 'en' ? CONFIG.text.textSizeEn : CONFIG.text.textSizeJaZh;
    // 屏幕上不低于 minPx：按舞台坐标反推
    if (scale > 0 && size * scale < minPx) size = minPx / scale;
    size = clamp(size, CONFIG.text.sizeMin, 96);
    let chars, cursors, width, spacing, font;

    const build = () => {
      font = family.replace('1px', size + 'px');
      spacing = size * (line.font === 'zh' ? 0.10 : (line.font === 'jp' ? 0.075 : 0.045));
      mctx.font = font;
      chars = Array.from(str);
      cursors = [];
      let x = 0;
      chars.forEach(ch => {
        cursors.push(x);
        x += mctx.measureText(ch).width + spacing;
      });
      width = Math.max(1, x - spacing);
    };

    build();
    for (let pass = 0; pass < 3 && width > maxW; pass++) {
      const target = Math.max(maxW / width, (minPx / Math.max(1e-4, scale)) / size);
      size *= target;
      build();
    }

    const write = line.font === 'en'
      ? CONFIG.text.writeEn
      : clamp(1.9 + chars.length * 0.02, CONFIG.text.minWrite, 2.4);
    return {
      chars, cursors, width, font, size, spacing, write,
      g: null, gVersion: -1
    };
  });  waitFontsThenGlyphs();
}

let fontsRequested = false;
function waitFontsThenGlyphs() {
  if (fontsRequested) { scheduleGlyphs(); return; }
  fontsRequested = true;
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => scheduleGlyphs());
  } else {
    scheduleGlyphs();
  }
}

function glyphDpr() { return Math.min(dpr, 1.6); }

function scheduleGlyphs() {
  glyphQueue.length = 0;
  for (let i = 0; i < textLines.length; i++) glyphQueue.push(i);
  const idle = window.requestIdleCallback
    ? window.requestIdleCallback.bind(window)
    : (cb) => setTimeout(() => cb({ timeRemaining: () => 8 }), 24);
  const step = () => {
    if (!glyphQueue.length) return;
    const idx = glyphQueue.shift();
    const line = textLines[idx];
    if (!line) { step(); return; }
    idle(() => {
      if (line.gVersion !== glyphVersion) buildGlyph(line);
      step();
    });
  };
  step();
}

/* --- Zhang-Suen 细化：把字形变成 1px 宽的中心线 --- */
function zhangSuen(bin, w, h) {
  const out = new Uint8Array(bin);
  let changed = true, guard = 0;
  while (changed && guard++ < 60) {
    changed = false;
    for (let pass = 0; pass < 2; pass++) {
      const marks = [];
      for (let y = 1; y < h - 1; y++) {
        const row = y * w;
        for (let x = 1; x < w - 1; x++) {
          const i = row + x;
          if (!out[i]) continue;
          const p2 = out[i - w], p3 = out[i - w + 1], p4 = out[i + 1],
                p5 = out[i + w + 1], p6 = out[i + w], p7 = out[i + w - 1],
                p8 = out[i - 1], p9 = out[i - w - 1];
          const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
          if (B < 2 || B > 6) continue;
          const seq = [p2, p3, p4, p5, p6, p7, p8, p9, p2];
          let A = 0;
          for (let k = 0; k < 8; k++) if (seq[k] === 0 && seq[k + 1] === 1) A++;
          if (A !== 1) continue;
          if (pass === 0) {
            if (p2 * p4 * p6 !== 0 || p4 * p6 * p8 !== 0) continue;
          } else {
            if (p2 * p4 * p8 !== 0 || p2 * p6 * p8 !== 0) continue;
          }
          marks.push(i);
        }
      }
      for (let k = 0; k < marks.length; k++) out[marks[k]] = 0;
      if (marks.length) changed = true;
    }
  }
  return out;
}

/* --- 倒角距离变换：估计笔画局部半径 --- */
function distanceMap(bin, w, h) {
  const d = new Float32Array(w * h);
  const INF = 1e9;
  for (let i = 0; i < d.length; i++) d[i] = bin[i] ? INF : 0;
  const h1 = 1, h2 = 1.4142135;
  for (let y = 1; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (d[i] <= 0) continue;
      let m = d[i];
      if (d[i - 1] + h1 < m) m = d[i - 1] + h1;
      if (d[i - w] + h1 < m) m = d[i - w] + h1;
      if (x > 0 && d[i - w - 1] + h2 < m) m = d[i - w - 1] + h2;
      if (x < w - 1 && d[i - w + 1] + h2 < m) m = d[i - w + 1] + h2;
      d[i] = m;
    }
  }
  for (let y = h - 2; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x;
      if (d[i] <= 0) continue;
      let m = d[i];
      if (d[i + 1] + h1 < m) m = d[i + 1] + h1;
      if (d[i + w] + h1 < m) m = d[i + w] + h1;
      if (x > 0 && d[i + w - 1] + h2 < m) m = d[i + w - 1] + h2;
      if (x < w - 1 && d[i + w + 1] + h2 < m) m = d[i + w + 1] + h2;
      d[i] = m;
    }
  }
  return d;
}

function buildGlyph(line) {
  const S = glyphDpr();
  const pad = Math.ceil(line.size * 0.40);
  const cssW = Math.ceil(line.width) + pad * 2;
  const cssH = Math.ceil(line.size * 1.9);
  const gw = Math.ceil(cssW * S), gh = Math.ceil(cssH * S);
  const baselineIn = pad + line.size * 1.15;

  const cv = document.createElement('canvas');
  cv.width = gw; cv.height = gh;
  const gc = cv.getContext('2d', { willReadFrequently: true });
  gc.setTransform(S, 0, 0, S, 0, 0);
  gc.fillStyle = '#ffffff';
  gc.font = line.font;
  gc.textAlign = 'left';
  gc.textBaseline = 'alphabetic';
  for (let i = 0; i < line.chars.length; i++) {
    gc.fillText(line.chars[i], pad + line.cursors[i], baselineIn);
  }

  const img = gc.getImageData(0, 0, gw, gh);
  const src = img.data;
  const bin = new Uint8Array(gw * gh);
  let inkCount = 0;
  for (let i = 0, p = 3; i < src.length; i += 4, p += 4) {
    if (src[p] > 60) { bin[i >> 2] = 1; inkCount++; }
  }

  const skel = zhangSuen(bin, gw, gh);
  const dist = distanceMap(bin, gw, gh);

  // 连通分量
  const seen = new Uint8Array(gw * gh);
  const comps = [];
  const q = [];
  for (let y0 = 0; y0 < gh; y0++) {
    for (let x0 = 0; x0 < gw; x0++) {
      const s0 = y0 * gw + x0;
      if (!skel[s0] || seen[s0]) continue;
      const comp = [];
      q.length = 0; q.push(s0); seen[s0] = 1;
      for (let qi = 0; qi < q.length; qi++) {
        const p = q[qi];
        comp.push(p);
        const px = p % gw, py = Math.floor(p / gw);
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = px + dx, ny = py + dy;
            if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
            const ni = ny * gw + nx;
            if (skel[ni] && !seen[ni]) { seen[ni] = 1; q.push(ni); }
          }
        }
      }
      if (comp.length > 2) comps.push(comp);
    }
  }

  const nbrs = (p) => {
    const out = [];
    const px = p % gw, py = Math.floor(p / gw);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
        const ni = ny * gw + nx;
        if (skel[ni]) out.push(ni);
      }
    }
    return out;
  };

  // 每个分量从最左端出发，优先直行；回溯时“抬笔”另起一段
  function trace(comp) {
    let start = comp[0];
    for (let k = 1; k < comp.length; k++) {
      const p = comp[k];
      if ((p % gw) < (start % gw) || ((p % gw) === (start % gw) && Math.floor(p / gw) < Math.floor(start / gw))) start = p;
    }
    const vis = new Uint8Array(gw * gh);
    const segs = [];
    let seg = [start];
    vis[start] = 1;
    const frames = [{ p: start, dir: null }];
    let cur = start, dir = null, guard = 0;
    const hasUn = (p) => {
      const ns = nbrs(p);
      for (let k = 0; k < ns.length; k++) if (!vis[ns[k]]) return true;
      return false;
    };
    while (guard++ < comp.length * 5 + 50) {
      const ns = nbrs(cur).filter(p => !vis[p]);
      if (ns.length) {
        let best = ns[0], bestScore = -9, bx = 0, by = 0;
        for (let k = 0; k < ns.length; k++) {
          const nx2 = (ns[k] % gw) - (cur % gw);
          const ny2 = Math.floor(ns[k] / gw) - Math.floor(cur / gw);
          const l = Math.hypot(nx2, ny2) || 1;
          const ux = nx2 / l, uy = ny2 / l;
          const score = dir ? ux * dir.x + uy * dir.y : 0;
          if (score > bestScore) { bestScore = score; best = ns[k]; bx = ux; by = uy; }
        }
        vis[best] = 1;
        seg.push(best);
        dir = { x: bx, y: by };
        cur = best;
        frames.push({ p: best, dir });
      } else {
        let opened = false;
        while (frames.length) {
          const f = frames[frames.length - 1];
          if (hasUn(f.p)) {
            if (seg.length >= 2) segs.push(seg);
            seg = [f.p];
            cur = f.p;
            dir = f.dir;
            opened = true;
            break;
          }
          frames.pop();
        }
        if (!opened) {
          if (seg.length >= 2) segs.push(seg);
          break;
        }
      }
    }
    if (seg.length >= 2) segs.push(seg);
    return segs;
  }

  const ordered = [];
  comps.forEach(comp => {
    let minX = 1e9, minY = 1e9;
    for (const p of comp) {
      const x = p % gw, y = Math.floor(p / gw);
      if (x < minX || (x === minX && y < minY)) { minX = x; minY = y; }
    }
    ordered.push({ comp, minX, minY });
  });
  ordered.sort((a, b) => (a.minX - b.minX) || (a.minY - b.minY));

  // 平滑 + 重采样（按近似 1px 的间距生成笔迹采样点）
  const samples = [];
  const stepLen = 1.15;
  ordered.forEach(item => {
    const segs = trace(item.comp);
    segs.forEach(pix => {
      if (pix.length < 2) return;
      const pts = pix.map(p => ({ x: p % gw, y: Math.floor(p / gw), r: dist[p] || 0.8 }));
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 1; i < pts.length - 1; i++) {
          pts[i].x = (pts[i - 1].x + pts[i].x * 2 + pts[i + 1].x) * 0.25;
          pts[i].y = (pts[i - 1].y + pts[i].y * 2 + pts[i + 1].y) * 0.25;
        }
      }
      let acc = 0;
      samples.push({ x: pts[0].x, y: pts[0].y, r: Math.max(1.0, pts[0].r), e: 0 });
      const runStartIdx = samples.length - 1;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const d = Math.hypot(b.x - a.x, b.y - a.y) || 0.0001;
        acc += d;
        while (acc >= stepLen) {
          const t = 1 - (acc - stepLen) / d;
          samples.push({
            x: lerp(a.x, b.x, clamp(t, 0, 1)),
            y: lerp(a.y, b.y, clamp(t, 0, 1)),
            r: Math.max(1.0, lerp(a.r, b.r, clamp(t, 0, 1))),
            e: 0
          });
          acc -= stepLen;
        }
      }
      const runEndIdx = samples.length - 1;
      samples[runEndIdx].e = 1;

      // 起笔 / 收笔各收窄约 25%
      for (let k = 0; k < 12; k++) {
        const ia = runStartIdx + k;
        const ib = runEndIdx - k;
        const f = 1 - CONFIG.text.tipTaper * (1 - k / 12);
        if (ia <= runEndIdx) samples[ia].r *= f;
        if (ib >= runStartIdx) samples[ib].r *= f;
      }
    });
  });

  const mask = document.createElement('canvas');
  mask.width = gw; mask.height = gh;
  const mctx = mask.getContext('2d');

  line.g = {
    canvas: cv, mask, mctx, gw, gh, S, pad, cssW, cssH, baselineIn,
    samples, maskFeather: CONFIG.text.feather * S,
    total: samples.length, revealed: 0, ready: true,
    fail: samples.length < Math.max(160, inkCount * 0.012)
  };
  line.gVersion = glyphVersion;
}

/* 遮罩盖章：以笔迹点为圆心画一个半径 = r×1.3 的柔边圆 */
function stampMask(g, idx) {
  const s = g.samples[Math.floor(clamp(idx, 0, g.samples.length - 1))];
  if (!s) return;
  const r = Math.max(1.2, s.r * CONFIG.text.maskScale);
  const c = g.mctx;
  const grd = c.createRadialGradient(s.x, s.y, r * 0.42, s.x, s.y, r + g.maskFeather);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.72, 'rgba(255,255,255,1)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = grd;
  c.beginPath();
  c.arc(s.x, s.y, r + g.maskFeather, 0, TAU);
  c.fill();
}

/* 按时间把遮罩推进到目标采样位置 */
function revealGlyph(g, target) {
  if (!g) return;
  if (target <= 0.01) return;
  const capped = Math.min(target, g.total);
  let guard = 0;
  while (g.revealed < capped && guard++ < 420) {
    g.revealed = Math.min(capped, g.revealed + 0.85);
    stampMask(g, g.revealed);
  }
}


/* ============================================================
   9. 绘制：底、树、彩带、装饰、雪、文字、纹理
   ============================================================ */
function paintBase(c, theme, aMound, aTrunk) {
  const { cx, yBot, halfW, Ht, width } = G;
  const baseY = G.treeBaseY || (yBot - Ht * 0.025);
  const trunkW = width * 0.045;
  const trunkTop = baseY - Ht * 0.015;
  const trunkBot = baseY + Ht * 0.052;
  const moundTop = trunkBot - Math.min(5, Ht * 0.008);

  if (aTrunk > 0.01) {
    c.save();
    c.globalAlpha = aTrunk;
    const grd = c.createLinearGradient(cx - trunkW * 0.5, 0, cx + trunkW * 0.5, 0);
    grd.addColorStop(0, shade(theme.trunk, 0.38));
    grd.addColorStop(0.34, theme.trunk);
    grd.addColorStop(1, shade(theme.trunk, -0.50));
    c.fillStyle = grd;
    c.beginPath();
    c.moveTo(cx - trunkW * 0.38, trunkTop);
    c.lineTo(cx + trunkW * 0.38, trunkTop);
    c.lineTo(cx + trunkW * 0.52, trunkBot);
    c.lineTo(cx - trunkW * 0.52, trunkBot);
    c.closePath();
    c.fill();
    // 树皮竖纹
    for (let k = 0; k < 10; k++) {
      const u = -0.40 + k * 0.088 + rrand(-0.02, 0.02);
      const yy = trunkTop + rrand(0.10, 0.32) * (trunkBot - trunkTop);
      c.globalAlpha = aTrunk * (k % 2 ? 0.32 : 0.48);
      c.strokeStyle = k % 2 ? shade(theme.trunk, -0.55) : shade(theme.trunk, 0.55);
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(cx + trunkW * u, yy);
      c.quadraticCurveTo(cx + trunkW * (u + 0.05), yy + (trunkBot - yy) * 0.5, cx + trunkW * (u + 0.02), trunkBot - 2);
      c.stroke();
    }
    // 根部积雪
    for (let k = 0; k < 4; k++) {
      const side = k % 2 ? 1 : -1;
      const sx = cx + side * trunkW * (0.34 + rrand(0, 0.45));
      c.globalAlpha = aTrunk * 0.55;
      c.fillStyle = theme.snowA;
      c.beginPath();
      c.ellipse(sx, trunkBot - rrand(0, 4), trunkW * rrand(0.26, 0.46), Ht * rrand(0.004, 0.008), side * 0.22, 0, TAU);
      c.fill();
    }
    c.restore();
  }
  c.globalAlpha = 1;
}
function drawMoundFront(theme) {
  const { cx, yBot, halfW, Ht, width } = G;
  const c = ctx;
  const baseY = G.treeBaseY || (yBot - Ht * 0.025);
  const trunkBot = baseY + Ht * 0.052;
  if (1 > 0.01) {
    const rx = halfW * 0.80;
    const topY = trunkBot - Math.min(7, Ht * 0.012);
    const baseY2 = topY + Ht * 0.056;
    c.save();
    // 地面反光：极淡
    c.globalAlpha = 1 * CONFIG.tree.groundGlowAlpha;
    const sh = c.createRadialGradient(cx, baseY2 + 4, 0, cx, baseY2 + 4, halfW * 0.54);
    sh.addColorStop(0, hexA(theme.snowA, 0.9));
    sh.addColorStop(1, hexA(theme.snowA, 0));
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse(cx, baseY2 + 4, halfW * 0.54, Ht * 0.022, 0, 0, TAU);
    c.fill();

    // 雪丘下方的接触阴影，让它坐在雪地上而不是浮着
    c.globalAlpha = 1 * 0.40;
    c.filter = 'blur(5px)';
    c.fillStyle = hexA(theme.bg, 0.9);
    c.beginPath();
    c.ellipse(cx, baseY2 + Ht * 0.012, rx * 0.92, Ht * 0.016, 0, 0, TAU);
    c.fill();
    c.filter = 'none';

    // 雪丘：起伏的雪堆轮廓，避免一个完美椭圆的“台面”感
    c.globalAlpha = 1;
    c.filter = 'blur(2px)';
    const g = c.createLinearGradient(0, topY - Ht * 0.02, 0, baseY2);
    g.addColorStop(0, mix(theme.snowA, theme.snowB, 0.14));
    g.addColorStop(0.55, mix(theme.snowA, theme.snowB, 0.40));
    g.addColorStop(1, mix(theme.snowA, theme.snowB, 0.62));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(cx - rx, baseY2 - Ht * 0.008);
    c.quadraticCurveTo(cx - rx * 0.92, topY + Ht * 0.012, cx - rx * 0.64, topY + Ht * 0.006);
    c.quadraticCurveTo(cx - rx * 0.44, topY - Ht * 0.004, cx - rx * 0.26, topY + Ht * 0.008);
    c.quadraticCurveTo(cx - rx * 0.10, topY + Ht * 0.014, cx + rx * 0.04, topY + Ht * 0.002);
    c.quadraticCurveTo(cx + rx * 0.22, topY - Ht * 0.006, cx + rx * 0.40, topY + Ht * 0.006);
    c.quadraticCurveTo(cx + rx * 0.62, topY + Ht * 0.016, cx + rx * 0.78, topY + Ht * 0.004);
    c.quadraticCurveTo(cx + rx * 0.94, topY + Ht * 0.008, cx + rx, baseY2 - Ht * 0.010);
    c.quadraticCurveTo(cx + rx * 0.5, baseY2 + Ht * 0.020, cx, baseY2 + Ht * 0.016);
    c.quadraticCurveTo(cx - rx * 0.5, baseY2 + Ht * 0.026, cx - rx, baseY2 + Ht * 0.004);
    c.closePath();
    c.fill();
    c.filter = 'none';

    // 雪面受光（沿上沿的一抹亮）
    c.globalAlpha = 1 * 0.42;
    const hg = c.createLinearGradient(0, topY - Ht * 0.01, 0, topY + Ht * 0.03);
    hg.addColorStop(0, hexA(theme.snowA, 0.7));
    hg.addColorStop(1, hexA(theme.snowA, 0));
    c.fillStyle = hg;
    c.beginPath();
    c.ellipse(cx - rx * 0.06, topY + Ht * 0.010, rx * 0.62, Ht * 0.018, 0, 0, TAU);
    c.fill();

    c.restore();
  }
}

function drawTreeLayer() {
  const themeNow = currentTheme();
  if (trans) {
    const p = easeInOut(clamp((vt - trans.t0) / trans.dur, 0, 1));
    const fromC = caches[trans.from];
    const toC = caches[trans.to];
    if (fromC && fromC.ready) {
      ctx.globalAlpha = 1 - p;
      ctx.drawImage(fromC.canvas, 0, 0, W, H);
    }
    if (toC && toC.ready) {
      ctx.globalAlpha = p;
      ctx.drawImage(toC.canvas, 0, 0, W, H);
    }
    ctx.globalAlpha = 1;
    return;
  }

  const cur = caches[themeState.cur];
  if (vt >= CONFIG.totalDuration && cur && cur.ready) {
    ctx.drawImage(cur.canvas, 0, 0, W, H);
    return;
  }

  const moundA = clamp(vt / 0.95, 0, 1);
  const trunkA = clamp((vt - 0.15) / 0.85, 0, 1);
  paintBase(ctx, themeNow, moundA, trunkA);
  paintBodies(ctx, themeNow, function (i) {
    return clamp((vt - (CONFIG.tree.treeStart + i * CONFIG.tree.layerGap)) / 0.55, 0, 1);
  });
  ctx.drawImage(sceneCanvas, 0, 0, W, H);

  for (let i = 0; i < active.length; i++) {
    const s = active[i];
    const p = clamp((vt - s.start) / s.dur, 0, 1);
    paintStroke(ctx, s, themeNow, easeOutCubic(p), true);
  }
}

function ribbonGrow() {
  if (ribbonFullMode) return 1;
  return clamp((vt - 6.5) / 2.8, 0, 1);
}

function ribbonSelfCheck() {
  if (!ribbon || !ribbon.samples.length) return;
  const s = ribbon.samples;
  let maxOut = -999, badQuads = 0, wMin = 1e9, wMax = 0, worst = null;
  for (let i = 0; i < s.length; i++) {
    const a = s[i];
    wMin = Math.min(wMin, a.w);
    wMax = Math.max(wMax, a.w);
    if (a.cos > 0) {
      const e = envAt(a.y);
      const out = Math.abs(a.x - e.cx) - e.half * 0.99;
      if (out > maxOut) { maxOut = out; worst = { x: a.x, y: a.y, w: a.w, half: e.half, cx: e.cx }; }
    }
    if (i < s.length - 1) {
      const b = s[i + 1];
      // 共享边的四边形天然连续，这里只统计中线跨度过大的采样
      if (Math.abs(b.y - a.y) > a.w * 0.15) badQuads++;
    }
  }
  const ratio = wMax / wMin;
  // 新增：最小带宽比（名义宽度）与相邻样本间距
  let minRatio = 1e9, maxGap = 0, maxMid = 0;
  for (let i = 0; i < s.length; i++) {
    const a = s[i];
    const t = a.t == null ? 0 : a.t;
    const wNom = CONFIG.ribbon.ribbonWidthBottom + (CONFIG.ribbon.ribbonWidthTop - CONFIG.ribbon.ribbonWidthBottom) * t;
    minRatio = Math.min(minRatio, a.w / wNom);
    if (i < s.length - 1) {
      const b = s[i + 1];
      maxGap = Math.max(maxGap, Math.hypot(b.x - a.x, b.y - a.y));
      maxMid = Math.max(maxMid, Math.abs(b.y - a.y) / a.w);
    }
  }
  if (badQuads > 0) console.warn('[ribbon] flipped quads: ' + badQuads);
  if (ratio > 1.15) console.log('[ribbon] nominal taper ratio ' + ratio.toFixed(3));
  if (maxOut > 0.5) console.warn('[ribbon] front outside envelope by ' + maxOut.toFixed(2), worst);
  if (minRatio < CONFIG.ribbon.ribbonMinWidthRatio) console.warn('[ribbon] thin band ' + minRatio.toFixed(3));
  if (maxGap > CONFIG.ribbon.ribbonMaxSampleGap + 0.5) console.warn('[ribbon] sample gap ' + maxGap.toFixed(2));
  if (maxMid > 0.15) console.warn('[ribbon] mid jump ' + maxMid.toFixed(3));
  console.log('[ribbon] turns=' + ribbon.turns + ' samples=' + s.length +
              ' maxOut=' + maxOut.toFixed(2) + ' wRatio=' + ratio.toFixed(3) +
              ' minRatio=' + minRatio.toFixed(3) + ' maxGap=' + maxGap.toFixed(2) +
              ' badQuads=' + badQuads);
}
function ribbonRel(theta) {
  let rel = (theta - ribbon.th0) % TAU;
  if (rel < 0) rel += TAU;
  return rel > Math.PI ? rel - TAU : rel;
}

function ribbonFrontAlpha(c) {
  return c >= 0 ? 1 : clamp((c + 0.15) / 0.15, 0, 1);
}

function ribbonSampleAt(theta) {
  const s = ribbon.samples;
  const u = (theta - ribbon.th0) / (ribbon.turns * TAU);
  if (u < 0 || u > 1) return null;
  const idx = clamp(u * (s.length - 1), 0, s.length - 1);
  const i0 = Math.floor(idx), i1 = Math.min(s.length - 1, i0 + 1);
  const f = idx - i0;
  const a = s[i0], b = s[i1];
  return {
    x: a.x + (b.x - a.x) * f,
    y: a.y + (b.y - a.y) * f,
    w: a.w + (b.w - a.w) * f,
    cos: Math.cos(theta)
  };
}

function ribbonSmooth(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function ribbonStripeGroups() {
  const deg = Math.PI / 180;
  const out = [];
  const end = ribbon.th0 + ribbon.turns * TAU;
  for (let n = 0; n <= ribbon.turns; n++) {
    for (const c of [-30 * deg, 26 * deg]) {
      let ang = n * TAU + c;
      while (ang < ribbon.th0) ang += TAU;
      if (ang > end) continue;
      out.push(ang);
    }
  }
  return out;
}

function ribbonInStripe(theta, padDeg) {
  const span = (4.2 + (padDeg || 0)) * Math.PI / 180;
  for (const c of ribbonStripeGroups()) {
    if (Math.abs(theta - c) <= span) return true;
  }
  return false;
}

function ribbonQuadB(t1, t2, col, alpha, dy) {
  const a = ribbonSampleAt(t1), b = ribbonSampleAt(t2);
  if (!a || !b) return;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y - a.w * 0.5 + (dy || 0));
  ctx.lineTo(b.x, b.y - b.w * 0.5 + (dy || 0));
  ctx.lineTo(b.x, b.y + b.w * 0.5 + (dy || 0));
  ctx.lineTo(a.x, a.y + a.w * 0.5 + (dy || 0));
  ctx.closePath();
  ctx.fill();
}

function drawRibbonBand(front, themeNow) {
  if (!ribbon || !front) return;
  const s = ribbon.samples;
  const p = ribbonGrow();
  if (p <= 0.002) return;
  const last = Math.min(s.length - 1, Math.floor(p * (s.length - 1)));
  const main = themeNow.ribbon[0];
  const light = themeNow.ribbonLight || mix(main, themeNow.ribbon[1], 0.85);
  const dark = themeNow.ribbonDark || shade(main, -0.35);
  const cream = themeNow.ribbonStripe || '#f5ead6';
  const stripe2 = themeNow.ribbonStripe2 || themeNow.ornaments[1];
  const shadow = mix(themeNow.treeShadow, themeNow.bg, 0.42);
  const deg = Math.PI / 180;
  const endTheta = ribbon.th0 + ribbon.turns * TAU;

  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // ---- 投影：贴得很紧，偏移 (1, 2.5)，用多层柔和叠加代替模糊 ----
  const segStep = perf.mode === 'on' ? 2 : 1;
  ctx.fillStyle = shadow;
  for (let i = 0; i < last; i += segStep) {
    const j = Math.min(last, i + segStep);
    const a = s[i], b = s[j];
    const al = ribbonFrontAlpha(Math.min(a.cos, b.cos));
    if (al <= 0.02) continue;
    for (let l = 0; l < 3; l++) {
      const o = 2.5 + l * 1.6;
      ctx.globalAlpha = (0.5 - l * 0.12) * al;
      ctx.beginPath();
      ctx.moveTo(a.x + 1, a.y - a.w * 0.5 + o);
      ctx.lineTo(b.x + 1, b.y - b.w * 0.5 + o);
      ctx.lineTo(b.x + 1, b.y + b.w * 0.5 + o);
      ctx.lineTo(a.x + 1, a.y + a.w * 0.5 + o);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // ---- 布带面：上 8% 提亮、下 12% 压暗，中线随机起伏 ----
  for (let i = 0; i < last; i += segStep) {
    const j = Math.min(last, i + segStep);
    const a = s[i], b = s[j];
    const al = ribbonFrontAlpha(Math.min(a.cos, b.cos));
    if (al <= 0.004) continue;
    const cMid = (a.cos + b.cos) * 0.5;
    const sinMid = (a.sin + b.sin) * 0.5;
    const faceT = 0.10 + 0.20 * Math.max(0, cMid);
    const sideT = 0.42 * ribbonSmooth(0.45, 0.95, Math.abs(sinMid));
    let col = mix(main, light, faceT);
    if (sideT > 0) col = mix(col, dark, sideT);

    ctx.globalAlpha = al * 0.97;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - a.w * 0.5);
    ctx.lineTo(b.x, b.y - b.w * 0.5);
    ctx.lineTo(b.x, b.y + b.w * 0.5);
    ctx.lineTo(a.x, a.y + a.w * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.7;
    ctx.stroke();

    // 上棱受光 / 下棱压暗
    ctx.globalAlpha = al * 0.55;
    ctx.fillStyle = mix(light, '#ffffff', 0.25);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - a.w * 0.5);
    ctx.lineTo(b.x, b.y - b.w * 0.5);
    ctx.lineTo(b.x, b.y - b.w * 0.5 + Math.max(1.2, b.w * 0.10));
    ctx.lineTo(a.x, a.y - a.w * 0.5 + Math.max(1.2, a.w * 0.10));
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = al * 0.50;
    ctx.fillStyle = mix(dark, '#000000', 0.10);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y + a.w * 0.5);
    ctx.lineTo(b.x, b.y + b.w * 0.5);
    ctx.lineTo(b.x, b.y + b.w * 0.5 - Math.max(1.4, b.w * 0.12));
    ctx.lineTo(a.x, a.y + a.w * 0.5 - Math.max(1.4, a.w * 0.12));
    ctx.closePath();
    ctx.fill();
  }

  // ---- 纱线噪点：细颗粒明暗点，让表面有毛线的粗糙感 ----
  for (let i = 0; i < last; i += 2) {
    const a = s[i];
    const al = ribbonFrontAlpha(a.cos);
    if (al <= 0.03) continue;
    const f = ribbonSmooth(0.10, 0.50, a.cos);
    for (let k = 0; k < 3; k++) {
      const h1 = Math.sin(a.theta * 137.5 + k * 91.3) * 43758.5453;
      const fy = (h1 - Math.floor(h1));
      const h2 = Math.sin(a.theta * 311.7 + k * 17.1) * 24634.6345;
      const fx = (h2 - Math.floor(h2));
      const x = a.x + (fx - 0.5) * 1.6;
      const y = a.y + (fy - 0.5) * a.w;
      if (k % 2 === 0) { ctx.fillStyle = light; ctx.globalAlpha = 0.12 * f; }
      else { ctx.fillStyle = dark; ctx.globalAlpha = 0.10 * f; }
      ctx.fillRect(x, y, 0.7, 0.7);
    }
  }

  // ---- 织进去的条纹：每圈 2 组，宽条 2.4°/窄条 1.0°，横跨整条带宽 ----
  for (const c of ribbonStripeGroups()) {
    const cSample = ribbonSampleAt(c);
    if (!cSample) continue;
    const fade = ribbonSmooth(0.10, 0.50, cSample.cos);
    if (fade <= 0.02) continue;
    const bands = [
      [-4.1, -1.7, cream],
      [-0.5, 0.5, stripe2],
      [1.7, 4.1, cream]
    ];
    for (const bd of bands) {
      const t1 = Math.max(ribbon.th0, c + bd[0] * deg);
      const t2 = Math.min(endTheta, c + bd[1] * deg);
      if (t2 <= t1) continue;
      ribbonQuadB(t1, t2, bd[2], 0.92 * fade, 0);
      // 条纹内部上亮下暗
      ribbonQuadB(t1, t2, mix(bd[2], '#ffffff', 0.15), 0.30 * fade, 0);
    }
  }

  // ---- 通长细条纹：下边缘内侧 2px ----
  for (let i = 0; i < last; i++) {
    const a = s[i], b = s[i + 1];
    const al = ribbonFrontAlpha(Math.min(a.cos, b.cos));
    if (al <= 0.02) continue;
    ctx.globalAlpha = 0.55 * al;
    ctx.strokeStyle = stripe2;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y + a.w * 0.5 - 2);
    ctx.lineTo(b.x, b.y + b.w * 0.5 - 2);
    ctx.stroke();
  }

  // ---- 侧面厚度与接缝 ----
  for (let i = 0; i <= last; i++) {
    const a = s[i];
    const k = ribbonSmooth(0.55, 0.95, Math.abs(a.sin));
    if (k <= 0.02) continue;
    const al = ribbonFrontAlpha(a.cos);
    if (al <= 0.01) continue;
    ctx.globalAlpha = 0.55 * k * al;
    ctx.strokeStyle = dark;
    ctx.lineWidth = 5 + 2 * k;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - a.w * 0.5 + 1.5);
    ctx.lineTo(a.x, a.y + a.w * 0.5 - 1.5);
    ctx.stroke();
    ctx.globalAlpha = 0.72 * k * al;
    ctx.strokeStyle = mix(dark, '#000000', 0.25);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(a.x + (a.sin > 0 ? 2 : -2), a.y - a.w * 0.5 + 2);
    ctx.lineTo(a.x + (a.sin > 0 ? 2 : -2), a.y + a.w * 0.5 - 2);
    ctx.stroke();
  }

  // ---- 横向罗纹：暗线 + 紧挨的亮线，每 1.6°（过密自动回退 2.2°）----
  const arcPerDeg = (TAU * (G.halfW * 0.8)) / 360;
  let ribDeg = perf.mode === 'on' ? 2.2 : CONFIG.ribbon.ribbonRibStep;
  if (arcPerDeg * ribDeg * scale < 1.4) ribDeg = CONFIG.ribbon.ribbonRibFallbackStep;
  const ribStepAng = ribDeg * deg;
  for (let th = ribbon.th0; th <= endTheta; th += ribStepAng) {
    const sm = ribbonSampleAt(th);
    if (!sm || sm.cos <= 0.02) continue;
    if (arcPerDeg * ribDeg * scale < 1.2) continue;
    const fade = ribbonSmooth(0.10, 0.50, sm.cos);
    const px = sm.w * 0.5;
    ctx.globalAlpha = 0.42 * fade;
    ctx.strokeStyle = dark;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(sm.x, sm.y - px + 0.8);
    ctx.lineTo(sm.x, sm.y + px - 0.8);
    ctx.stroke();
    ctx.globalAlpha = 0.32 * fade;
    ctx.strokeStyle = light;
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(sm.x + 0.8, sm.y - px + 1.4);
    ctx.lineTo(sm.x + 0.8, sm.y + px - 1.4);
    ctx.stroke();
  }

  // ---- V 形针脚：两排错位鱼骨 ----
  let row = 0;
  for (let th = ribbon.th0; th <= endTheta; th += ribStepAng) {
    const sm = ribbonSampleAt(th);
    if (!sm || sm.cos <= 0.02) continue;
    const fade = ribbonSmooth(0.10, 0.50, sm.cos);
    if (fade <= 0.03) continue;
    const px = sm.w * 0.5;
    const offY = row % 2 ? px * 0.16 : -px * 0.16;
    const len = sm.w * 0.26;
    const vy = len * 0.56, hx = len * 0.42;
    ctx.globalAlpha = 0.26 * fade;
    ctx.strokeStyle = light;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sm.x - hx, sm.y + offY - vy);
    ctx.lineTo(sm.x + hx, sm.y + offY);
    ctx.lineTo(sm.x - hx, sm.y + offY + vy);
    ctx.stroke();
    row++;
  }

  // ---- 边缘虚线缝线（内侧 3px，短针脚 2.4 / 间隔 1.8）----
  const stitchPeriod = CONFIG.ribbon.ribbonStitchLen + CONFIG.ribbon.ribbonStitchGap;
  for (const dir of [-1, 1]) {
    ctx.strokeStyle = light;
    ctx.lineWidth = 0.8;
    for (let i = 0; i < last; i++) {
      const a = s[i], b = s[i + 1];
      const al = ribbonFrontAlpha(Math.min(a.cos, b.cos));
      if (al <= 0.03) continue;
      const phase = a.s % stitchPeriod;
      if (phase > CONFIG.ribbon.ribbonStitchLen) continue;
      const segLen = Math.max(0.001, b.s - a.s);
      const u0 = Math.min(1, phase / segLen);
      const u1 = Math.min(1, (CONFIG.ribbon.ribbonStitchLen - phase >= segLen ? 1 : (CONFIG.ribbon.ribbonStitchLen - phase) / segLen));
      if (u1 <= u0) continue;
      const x0 = a.x + (b.x - a.x) * u0, y0 = a.y + (b.y - a.y) * u0;
      const x1 = a.x + (b.x - a.x) * u1, y1 = a.y + (b.y - a.y) * u1;
      const wI0 = a.w + (b.w - a.w) * u0, wI1 = a.w + (b.w - a.w) * u1;
      ctx.globalAlpha = 0.45 * al;
      ctx.beginPath();
      ctx.moveTo(x0, y0 + dir * (wI0 * 0.5 - 3));
      ctx.lineTo(x1, y1 + dir * (wI1 * 0.5 - 3));
      ctx.stroke();
    }
  }

  // ---- 上下轮廓 1px 浅色描边 ----
  for (const dir of [-1, 1]) {
    ctx.strokeStyle = mix(light, '#ffffff', 0.30);
    ctx.lineWidth = 1;
    for (let i = 0; i < last; i++) {
      const a = s[i], b = s[i + 1];
      const al = ribbonFrontAlpha(Math.min(a.cos, b.cos));
      if (al <= 0.02) continue;
      ctx.globalAlpha = 0.35 * al;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y + dir * a.w * 0.5);
      ctx.lineTo(b.x, b.y + dir * b.w * 0.5);
      ctx.stroke();
    }
  }

  // ---- 边缘毛边：更短更干净 ----
  for (let i = 0; i <= last; i += 3) {
    const a = s[i];
    const relDeg = Math.abs(ribbonRel(a.theta)) / deg;
    const edgeFade = 1 - ribbonSmooth(70, 90, relDeg);
    const fade = ribbonSmooth(0.10, 0.50, a.cos) * edgeFade;
    if (fade <= 0.02) continue;
    const px = a.w * 0.5;
    const strands = perf.mode === 'on' ? 1 : (i % 2 ? 1 : 2);
    for (let k = 0; k < strands; k++) {
      const dir = (i + k) % 2 ? 1 : -1;
      const jitter = (rng() - 0.5) * 2.2;
      ctx.globalAlpha = (0.30 + rng() * 0.20) * fade;
      ctx.strokeStyle = light;
      ctx.lineWidth = 0.65;
      ctx.beginPath();
      ctx.moveTo(a.x + jitter, a.y + dir * px);
      ctx.lineTo(a.x + jitter + (rng() - 0.5) * 1.2, a.y + dir * (px + 1 + rng() * 1.4));
      ctx.stroke();
    }
  }

  // ---- 上边缘积雪 ----
  if (ribbon.snowCaps && ribbon.snowCaps.length) {
    ctx.save();
    ctx.filter = 'blur(1.2px)';
    for (const cap of ribbon.snowCaps) {
      const x = cap.x + Math.sin(vt * 0.6 + cap.ph) * 0.8;
      ctx.globalAlpha = 0.86;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, cap.y - 0.5, cap.rx, cap.ry, 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#8fa8b8';
      ctx.beginPath();
      ctx.ellipse(x, cap.y + cap.ry * 0.7, cap.rx * 0.9, 1.2, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---- 生长前端亮点 ----
  if (p < 1) {
    const a = s[last];
    const r = 11;
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawRibbonBack(themeNow) {
  // 背面被树体遮挡：约束在轮廓内，不额外绘制
}

function drawRibbon(themeNow) {
  if (!ribbon) return;
  drawRibbonTails(themeNow);
  drawRibbonBand(true, themeNow);
}

function drawScarf(themeNow) {
  if (!ribbon) return;
  const main = ctx;
  const p = ribbonGrow();
  const cur = fullFor(themeState.cur, true);
  const fromF = trans ? fullFor(trans.from, true) : null;
  const toF = trans ? fullFor(trans.to, true) : null;

  ctx = scarfCtx;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);

  const drawOne = (item, alpha) => {
    if (!item) return;
    revealScarf(item, p);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(item.shown, 0, 0, W, H);
    ctx.restore();
  };

  if (trans && fromF && toF) {
    const k = easeInOut(clamp((vt - trans.t0) / trans.dur, 0, 1));
    drawOne(fromF, 1 - k);
    drawOne(toF, k);
  } else if (cur) {
    drawOne(cur, 1);
  } else {
    drawRibbonTails(themeNow);
    drawRibbonBand(true, themeNow);
  }

  ctx = main;
  ctx.drawImage(scarfCanvas, 0, 0, W, H);
  drawScarfNeedles(themeNow);
}

// 增量揭示：每帧只把新到达的切片从完整贴图搬到 scarfShown
function revealScarf(item, p) {
  const s = ribbon.samples;
  const N = s.length;
  const target = Math.min(N - 1, Math.floor(p * (N - 1)));
  const S = CONFIG.ribbon.scarfSliceCount || 60;
  const per = Math.max(1, Math.ceil((N - 1) / S));
  const c = item.shownCtx;
  let upto = item.sliceUpto || 0;
  while (upto < N - 1) {
    const i0 = upto, i1 = Math.min(N - 1, i0 + per);
    if (i1 > target) break;
    c.save();
    c.beginPath();
    for (let i = i0; i < i1; i++) {
      const a = s[i], b = s[i + 1];
      c.moveTo(a.x, a.y - a.w * 0.5 - 1);
      c.lineTo(b.x, b.y - b.w * 0.5 - 1);
      c.lineTo(b.x, b.y + b.w * 0.5 + 1);
      c.lineTo(a.x, a.y + a.w * 0.5 + 1);
      c.closePath();
    }
    c.clip();
    c.drawImage(item.canvas, 0, 0, W, H);
    c.restore();
    upto = i1;
    item.sliceUpto = upto;
  }
  if (p >= 0.02 && !item.tailShown && ribbon.tailRect) {
    const r = ribbon.tailRect;
    c.save();
    c.beginPath();
    c.rect(r.x, r.y, r.w, r.h);
    c.clip();
    c.drawImage(item.canvas, 0, 0, W, H);
    c.restore();
    item.tailShown = true;
  }
  if (p >= 0.985 && !item.knotShown && ribbon.knotRect) {
    const r = ribbon.knotRect;
    c.save();
    c.beginPath();
    c.rect(r.x, r.y, r.w, r.h);
    c.clip();
    c.drawImage(item.canvas, 0, 0, W, H);
    c.restore();
    item.knotShown = true;
  }
}

// 围巾完整贴图：每个主题一张，构建完成后只做映射与揭示
let ribbonFullMode = false;
const scarfFulls = new Map();

function scarfFullKey(i) {
  return i + '|' + scarfCanvas.width + 'x' + scarfCanvas.height;
}

function buildScarfFull(i) {
  if (!ribbon || !ribbon.samples.length) return null;
  const key = scarfFullKey(i);
  if (scarfFulls.has(key)) return scarfFulls.get(key);
  const cv = document.createElement('canvas');
  cv.width = scarfCanvas.width;
  cv.height = scarfCanvas.height;
  const c = cv.getContext('2d');
  c.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const main = ctx;
  const oldVt = vt;
  ctx = c;
  ribbonFullMode = true;
  vt = 0;
  try {
    drawRibbonTails(THEMES[i]);
    drawRibbonBand(true, THEMES[i]);
  } catch (err) {
    console.warn('[scarf] build error', err);
  } finally {
    ribbonFullMode = false;
    vt = oldVt;
    ctx = main;
  }
  const shown = document.createElement('canvas');
  shown.width = cv.width;
  shown.height = cv.height;
  const shownCtx = shown.getContext('2d');
  shownCtx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const item = { canvas: cv, shown: shown, shownCtx: shownCtx, key: key, ready: true, sliceUpto: 0, tailShown: false, knotShown: false };
  scarfFulls.set(key, item);
  // 只保留当前与下一个主题
  for (const k of Array.from(scarfFulls.keys())) {
    if (k !== scarfFullKey(themeState.cur) && k !== scarfFullKey((themeState.cur + 1) % THEMES.length)) {
      scarfFulls.delete(k);
    }
  }
  scarfCheck(item);
  return item;
}

function fullFor(i, kick) {
  const key = scarfFullKey(i);
  const hit = scarfFulls.get(key);
  if (hit) return hit;
  if (kick) kickScarfFull(i);
  return null;
}

let scarfKickTimer = 0, scarfKicking = -1;
function kickScarfFull(i) {
  if (scarfFulls.has(scarfFullKey(i))) return;
  scarfKicking = i;
  if (scarfKickTimer) return;
  scarfKickTimer = setTimeout(() => {
    scarfKickTimer = 0;
    const idx = scarfKicking;
    scarfKicking = -1;
    if (idx >= 0) buildScarfFull(idx);
  }, 0);
}

function scarfCheck(item) {
  if (!item) return;
  try {
    const c = item.canvas.getContext('2d');
    const w = item.canvas.width, h = item.canvas.height;
    let any = 0, tested = 0;
    if (w > 8 && h > 8) {
      const d = c.getImageData(0, 0, w, h).data;
      for (let y = 4; y < h; y += Math.max(8, Math.floor(h / 24))) {
        for (let x = 4; x < w; x += Math.max(8, Math.floor(w / 24))) {
          tested++;
          if (d[(y * w + x) * 4 + 3] > 8) any++;
        }
      }
    }
    if (tested && any === 0) console.warn('[scarf] full layer empty');
  } catch (e) { /* 忽略 */ }
}

// 按弧长揭示：同一 s 位置的底色、纹理、条纹、缝线一起露出
function scarfRevealClip(p) {
  const s = ribbon.samples;
  if (p >= 1) return;
  const last = Math.max(0, Math.min(s.length - 1, Math.floor(p * (s.length - 1))));
  ctx.beginPath();
  for (let i = 0; i < last; i++) {
    const a = s[i], b = s[i + 1];
    ctx.moveTo(a.x, a.y - a.w * 0.5);
    ctx.lineTo(b.x, b.y - b.w * 0.5);
    ctx.lineTo(b.x, b.y + b.w * 0.5);
    ctx.lineTo(a.x, a.y + a.w * 0.5);
    ctx.closePath();
  }
  ctx.clip();
}

// 前景针叶压边：画在图层之上，不缓存，主题切换不会残留旧色
function drawScarfNeedles(themeNow) {
  if (!ribbon.needles || !ribbon.needles.length) return;
  const p = ribbonGrow();
  ctx.save();
  ctx.lineCap = 'round';
  for (const nd of ribbon.needles) {
    if (nd.sNorm > p) continue;
    const fade = ribbonSmooth(0.10, 0.50, nd.cos);
    if (fade <= 0.02) continue;
    ctx.globalAlpha = 0.55 * fade;
    ctx.strokeStyle = nd.bright ? themeNow.treeHighlight : themeNow.treeLight;
    ctx.lineWidth = nd.w;
    ctx.beginPath();
    ctx.moveTo(nd.x, nd.y);
    ctx.lineTo(nd.x + nd.dx, nd.y + nd.dy);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawRibbonTails(themeNow) {
  const p = ribbonGrow();
  if (p <= 0.02) return;
  const s = ribbon.samples;
  const main = themeNow.ribbon[0];
  const light = themeNow.ribbonLight || mix(main, themeNow.ribbon[1], 0.85);
  const dark = themeNow.ribbonDark || shade(main, -0.35);
  const cream = themeNow.ribbonStripe || '#f5ead6';
  const stripe2 = themeNow.ribbonStripe2 || themeNow.ornaments[1];

  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // ---- 下端长尾：挂在最下圈右侧前段（θ≈+42°）的下边缘，沿右轮廓垂下 ----
  const a0 = s[Math.round((s.length - 1) * 0.03)];
  const e0 = envAt(a0.y);
  const w0 = a0.w * 0.85;
  const x0 = Math.min(a0.x, e0.cx + e0.half - w0 * 0.5 - 3);
  const y0 = a0.y + a0.w * 0.5 - 1;
  const len = Math.min(72, Math.max(56, G.yBot - y0 - 14));
  const segs = 26;
  const swing = Math.sin(vt * (TAU / 5) + ribbon.tailPhase) * 1.6 * Math.PI / 180;
  const pts = [];
  for (let j = 0; j <= segs; j++) {
    const u = j / segs;
    const sy = y0 + len * u;
    const e = envAt(sy);
    const legal = e.cx + e.half - w0 * 0.5 - 4;
    const lean = -2 * u;
    const sway = Math.sin(swing) * len * u * 0.55;
    pts.push({ x: Math.min(legal, Math.max(e.cx, x0 + lean + sway)), y: sy, w: w0 * (1 - 0.06 * u) });
  }

  // 交接处褶皱阴影
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = hexA(themeNow.ribbonShadow || dark, 0.55);
  ctx.beginPath();
  ctx.ellipse(x0, y0 + 2, w0 * 0.42, 4, 0, 0, TAU);
  ctx.fill();

  // 尾巴布面
  ctx.globalAlpha = 0.96;
  ctx.fillStyle = main;
  ctx.beginPath();
  for (let j = 0; j <= segs; j++) {
    const q = pts[j];
    if (j === 0) ctx.moveTo(q.x - q.w * 0.5, q.y); else ctx.lineTo(q.x - q.w * 0.5, q.y);
  }
  const e = pts[segs];
  ctx.lineTo(e.x + e.w * 0.42, e.y + 9);          // 斜剪口
  ctx.lineTo(e.x + e.w * 0.5, e.y);
  for (let j = segs; j >= 0; j--) {
    const q = pts[j];
    ctx.lineTo(q.x + q.w * 0.5, q.y);
  }
  ctx.closePath();
  ctx.fill();

  // 末端条纹（距末端 10 / 20px）
  for (const dy of [10, 20]) {
    const yy = e.y - dy;
    const q = pts[Math.max(0, Math.round((yy - pts[0].y) / (len / segs)))];
    if (!q) continue;
    ctx.globalAlpha = 0.62;
    ctx.strokeStyle = dy === 10 ? cream : stripe2;
    ctx.lineWidth = dy === 10 ? 2.8 : 2;
    ctx.beginPath();
    ctx.moveTo(q.x - q.w * 0.5 + 1, yy);
    ctx.lineTo(q.x + q.w * 0.5 - 1, yy);
    ctx.stroke();
  }

  // 锁边缝线（距末端 6px）
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = light;
  ctx.lineWidth = 0.9;
  ctx.setLineDash([2.4, 1.8]);
  ctx.beginPath();
  ctx.moveTo(e.x - e.w * 0.5 + 1, e.y - 6);
  ctx.lineTo(e.x + e.w * 0.5 - 1, e.y - 6);
  ctx.stroke();
  ctx.setLineDash([]);

  // 流苏：4 束 × 3 根，每根两股细线
  ctx.globalAlpha = 0.78;
  for (let b = 0; b < 4; b++) {
    const base = (-0.5 + b / 3.6) * e.w * 0.86;
    for (let j = 0; j < 3; j++) {
      const off = base + j * 1.6;
      const fl = 10 + ((b * 3 + j) % 4) * 1.5;
      const sw = Math.sin(vt * 1.4 + (b * 3 + j) * 0.8 + ribbon.tailPhase) * 2.0;
      ctx.strokeStyle = (b + j) % 2 ? cream : light;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(e.x + off - 0.5, e.y + 4);
      ctx.lineTo(e.x + off - 0.5 + sw, e.y + 4 + fl);
      ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(e.x + off + 0.5, e.y + 4.5);
      ctx.lineTo(e.x + off + 0.5 + sw * 1.1, e.y + 4 + fl - 1);
      ctx.stroke();
      ctx.globalAlpha = 0.78;
    }
  }

  const f = round || 0;
  const ent = [], ex = [];
  for (let k = 0; k < n; k++) {
    const P = pts[k], Pr = pts[(k - 1 + n) % n], Ne = pts[(k + 1) % n];
    ent.push({ x: P.x + (Pr.x - P.x) * f, y: P.y + (Pr.y - P.y) * f });
    ex.push({ x: P.x + (Ne.x - P.x) * f, y: P.y + (Ne.y - P.y) * f });
  }
  c.beginPath();
  c.moveTo(ex[n - 1].x, ex[n - 1].y);
  for (let k = 0; k < n; k++) {
    c.lineTo(ent[k].x, ent[k].y);
    c.quadraticCurveTo(pts[k].x, pts[k].y, ex[k].x, ex[k].y);

  for (const L of textLines) t += L.write + CONFIG.text.hold + CONFIG.text.fade + CONFIG.text.pause;

  const textStart = 12.2;
  if (vt < textStart || !textLines.length) return;

  let li = 0, local = 0, alpha = 1, rise = 0;

  if (reduce) {
    li = 0;
    local = 999;
  } else {
    const total = textTotalCycle();
    let tAll = (vt - textStart) % total;
    let acc = 0;
    for (let i = 0; i < textLines.length; i++) {
      const L = textLines[i];
      const d = L.write + CONFIG.text.hold + CONFIG.text.fade + CONFIG.text.pause;
      if (tAll < acc + d) { li = i; local = tAll - acc; break; }
      acc += d;
    }
    const L0 = textLines[li];
    if (local >= L0.write + CONFIG.text.hold + CONFIG.text.fade) return;
    if (local >= L0.write + CONFIG.text.hold) {
      const f = (local - L0.write - CONFIG.text.hold) / CONFIG.text.fade;
      alpha = 1 - easeInOut(f);
      rise = 4 * easeInOut(f);
    }
  }

  const L = textLines[li];
  const g = L.g;
  const id = Math.floor((vt - textStart) / Math.max(0.01, textTotalCycle()));
  const baseY = H - H * CONFIG.text.yRatio - rise;

  if (!g) {
    drawTextFallbackPlain(L, baseY, alpha, themeNow);
    return;
  }

  // 换句或新一轮循环时清空遮罩
  if (sigState.li !== li || sigState.cycle !== id) {
    sigState.li = li; sigState.cycle = id;
    g.revealed = 0;
    g.mctx.clearRect(0, 0, g.gw, g.gh);
  }

  let pen = null;

  if (reduce) {
    masked = false;

    const p = easeInOut(local / L.write);
    if (g.fail) {
      drawWipeMask(g, p);
      pen = { x: g.pad + g.cssW * p, y: g.baselineIn };
    } else {
      revealGlyph(g, p * g.total);
      pen = penPoint(g);
    }

    masked = false;
  }

    sc.drawImage(g.mask, 0, 0);
    sc.globalCompositeOperation = 'source-over';

  sc.fillStyle = themeNow.text;
  sc.fillRect(0, 0, g.gw, g.gh);
  sc.globalCompositeOperation = 'source-over';

    ctx.fill();
