  }

  let masked = false;
  let pen = null;

  if (reduce) {
    masked = false;
  } else if (local < L.write) {
    masked = true;
    const p = easeInOut(local / L.write);
    if (g.fail) {
      drawWipeMask(g, p);
      pen = { x: g.pad + g.cssW * p, y: g.baselineIn };
    } else {
      revealGlyph(g, p * g.total);
      pen = penPoint(g);
    }
  } else {
    masked = false;
  }

  // 无论用哪套字体，都保证整句落在画布内
  const fit = Math.min(1, (W * 0.84) / g.cssW);
  const dw = g.cssW * fit, dh = g.cssH * fit;
  const originX = (W - dw) * 0.5;
  const originY = baseY - g.baselineIn * fit;

  if (sigScratch.width !== g.gw || sigScratch.height !== g.gh) {
    sigScratch.width = g.gw;
    sigScratch.height = g.gh;
    sigScratchCtx = sigScratch.getContext('2d');
  }
  const sc = sigScratchCtx;
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.globalCompositeOperation = 'source-over';
  sc.globalAlpha = 1;
  sc.clearRect(0, 0, g.gw, g.gh);
  sc.drawImage(g.canvas, 0, 0);
  if (masked) {
    sc.globalCompositeOperation = 'destination-in';
    sc.drawImage(g.mask, 0, 0);
    sc.globalCompositeOperation = 'source-over';
  }
  sc.globalCompositeOperation = 'source-in';
  sc.fillStyle = themeNow.text;
  sc.fillRect(0, 0, g.gw, g.gh);
  sc.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.shadowColor = hexA(themeNow.text, 0.36);
  ctx.shadowBlur = 5;
  ctx.drawImage(sigScratch, originX, originY, dw, dh);

  // 墨迹沉淀：亮度 105% → 100%
  if (!reduce && local >= L.write && local < L.write + CONFIG.text.settle) {
    const k = 1 - (local - L.write) / CONFIG.text.settle;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.055 * k * alpha;
    ctx.drawImage(sigScratch, originX, originY, dw, dh);
  }
  ctx.restore();

  // 笔尖亮点 + 柔光
  if (pen && !reduce) {
    const px = originX + (pen.x / g.S) * fit;
    const py = originY + (pen.y / g.S) * fit;
    const rad = CONFIG.text.penGlow;
    const gr = ctx.createRadialGradient(px, py, 0, px, py, rad);
    gr.addColorStop(0, hexA(mix(themeNow.text, '#ffffff', 0.75), 0.75));
    gr.addColorStop(0.28, hexA(themeNow.text, 0.38));
    gr.addColorStop(1, hexA(themeNow.text, 0));
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(px, py, rad, 0, TAU);
    ctx.fill();
    ctx.fillStyle = mix(themeNow.text, '#ffffff', 0.85);
    ctx.beginPath();
    ctx.arc(px, py, CONFIG.text.penRadius, 0, TAU);
    ctx.fill();
  }
}

function penPoint(g) {
  const idx = Math.floor(clamp(g.revealed, 0, g.samples.length - 1));
  const s = g.samples[idx];
  return s ? { x: s.x, y: s.y } : { x: g.pad, y: g.baselineIn };
}

function drawWipeMask(g, p) {
  const c = g.mctx;
  const w = g.gw * p;
  c.clearRect(0, 0, g.gw, g.gh);
  const grd = c.createLinearGradient(Math.max(0, w - g.maskFeather * 16), 0, w + g.maskFeather * 16, 0);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.6, 'rgba(255,255,255,1)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = grd;
  c.fillRect(0, 0, Math.min(g.gw, w + g.maskFeather * 16), g.gh);
}

function drawTextFallbackPlain(L, baseY, alpha, themeNow) {
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.font = L.font;
  ctx.fillStyle = themeNow.text;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const x0 = (W - L.width) * 0.5;
  for (let i = 0; i < L.chars.length; i++) ctx.fillText(L.chars[i], x0 + L.cursors[i], baseY);
  ctx.restore();
}


/* ============================================================
   10. 主题缓存与过渡
   ============================================================ */
function createCache(i) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(W * scale * dpr));
  cv.height = Math.max(1, Math.round(H * scale * dpr));
  const c = cv.getContext('2d');
  c.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  caches[i] = { canvas: cv, ctx: c, idx: 0, ready: false };
  return caches[i];
}

function renderCacheNow(i) {
  if (caches[i] && caches[i].ready) return;
  const item = caches[i] || createCache(i);
  const theme = THEMES[i];
  item.ctx.clearRect(0, 0, W, H);
  paintBase(item.ctx, theme, 1, 1);
  paintBodies(item.ctx, theme, null);
  for (let k = 0; k < strokes.length; k++) {
    paintStroke(item.ctx, strokes[k], theme, 1, false);
  }
  item.idx = strokes.length;
  item.ready = true;
}

// 性能模式下只保留「当前主题 + 下一个主题」两张离屏画布
function cacheWindow() {
  if (perf.mode !== 'on') {
    const all = [];
    for (let i = 0; i < THEMES.length; i++) all.push(i);
    return all;
  }
  return [themeState.cur, (themeState.cur + 1) % THEMES.length];
}

function kickCaches() {
  cacheQueue.length = 0;
  const keep = cacheWindow();
  for (const i of keep) {
    if (!caches[i] || !caches[i].ready) cacheQueue.push(i);
  }
  if (perf.mode === 'on') {
    for (let i = 0; i < THEMES.length; i++) {
      if (keep.indexOf(i) < 0) caches[i] = null;
    }
  }
}

function pumpCaches(budgetMs) {
  if (!cacheQueue.length) return;
  const i = cacheQueue[0];
  const item = caches[i] || createCache(i);
  if (item.idx === 0) {
    item.ctx.clearRect(0, 0, W, H);
    paintBase(item.ctx, THEMES[i], 1, 1);
    paintBodies(item.ctx, THEMES[i], null);
  }
  const t0 = performance.now();
  while (item.idx < strokes.length && performance.now() - t0 < budgetMs) {
    paintStroke(item.ctx, strokes[item.idx], THEMES[i], 1, false);
    item.idx++;
  }
  if (item.idx >= strokes.length) {
    item.ready = true;
    cacheQueue.shift();
    themeState.ready = caches[themeState.cur] && caches[themeState.cur].ready;
  }
}


function currentTheme() {
  if (trans) {
    const p = easeInOut(clamp((vt - trans.t0) / trans.dur, 0, 1));
    return mixTheme(THEMES[trans.from], THEMES[trans.to], p);
  }
  return THEMES[themeState.cur];
}

function startTransition(target) {
  if (target < 0 || target >= THEMES.length) return;
  if (vt < CONFIG.totalDuration) return;
  if (!caches[target] || !caches[target].ready) renderCacheNow(target);
  scarfItemFor(target);
  if (!trans && target === themeState.cur) return;
  let from = themeState.cur;
  if (trans) {
    const p = clamp((vt - trans.t0) / trans.dur, 0, 1);
    from = p < 0.5 ? trans.from : trans.to;
    if (!caches[from] || !caches[from].ready) from = themeState.cur;
  }
  trans = {
    from, to: target, t0: vt,
    dur: reduce ? CONFIG.theme.fadeReduced : (perf.mode === 'on' ? 2.4 : CONFIG.theme.fade)
  };
  themeState.cur = target;
  nextSwitchAt = vt + CONFIG.theme.manualHold;
  updateThemeUI();
}

/* 手机性能模式：自动检测 */
function detectPerf() {
  if (CONFIG.perfMode === 'on') { perf.mode = 'on'; }
  else if (CONFIG.perfMode === 'off') { perf.mode = 'off'; }
  else {
    const vw = Math.min(window.innerWidth, VW || window.innerWidth);
    const cores = navigator.hardwareConcurrency || 8;
    perf.mode = (vw < CONFIG.mobileBreakpoint || cores <= 4) ? 'on' : 'off';
  }
  perf.factor = perf.mode === 'on' ? 0.5 : 1;
}

function applyPerfLevel() {
  if (!flakes.length && !lights.length) return;
  if (perf.level >= 2) {
    flakes = flakes.filter((f, i) => i % 10 < 7);
    if (lights.length > 30) lights = lights.filter((l, i) => i % 10 < 7);
  }
}

/* ============================================================
   11. 主循环
   ============================================================ */
function advanceStrokes() {
  while (cursor < strokes.length && strokes[cursor].start <= vt) {
    active.push(strokes[cursor]);
    cursor++;
  }
  for (let i = active.length - 1; i >= 0; i--) {
    const s = active[i];
    if ((vt - s.start) / s.dur >= 1) {
      paintStroke(sceneCtx, s, THEMES[themeState.cur], 1, false);
      active.splice(i, 1);
    }
  }
}

function fillScene() {
  sceneCtx.clearRect(0, 0, W, H);
  for (const s of strokes) paintStroke(sceneCtx, s, THEMES[themeState.cur], 1, false);
  cursor = strokes.length;
  active.length = 0;
}

function viewRect() {
  // 可见区域在舞台逻辑坐标下的范围（舞台之外的留白也要有背景）
  return { x: -ox / scale, y: -oy / scale, w: VW / scale, h: VH / scale };
}

function drawBackground(themeNow) {
  const R0 = viewRect();
  ctx.fillStyle = themeNow.bg;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);

  const blobs = [
    { x: 0.18, y: 0.74, r: 0.62, c: themeNow.blobs[0] },
    { x: 0.84, y: 0.52, r: 0.58, c: themeNow.blobs[1] },
    { x: 0.70, y: 0.14, r: 0.52, c: themeNow.blobs[2] },
    { x: 0.10, y: 0.18, r: 0.42, c: themeNow.blobs[1] }
  ];
  for (const b of blobs) {
    const R = Math.max(R0.w, R0.h) * b.r;
    const bx = R0.x + R0.w * b.x;
    const by = R0.y + R0.h * b.y;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
    g.addColorStop(0, hexA(b.c, 0.42));
    g.addColorStop(1, hexA(b.c, 0));
    ctx.fillStyle = g;
    ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
  }

  // 远处的景深光斑，极慢地上下浮动
  const bok = [
    [0.10, 0.30, 58], [0.22, 0.16, 34], [0.78, 0.22, 62], [0.90, 0.42, 40],
    [0.06, 0.62, 48], [0.34, 0.72, 26], [0.66, 0.78, 52], [0.86, 0.70, 30],
    [0.16, 0.46, 22], [0.52, 0.10, 44], [0.94, 0.86, 36], [0.42, 0.34, 20],
    [0.74, 0.55, 24], [0.28, 0.56, 18]
  ];
  for (let i = 0; i < (perf.mode === 'on' ? 7 : bok.length); i++) {
    const bx = R0.x + R0.w * bok[i][0] + Math.sin(vt * 0.05 + i) * 12;
    const by = R0.y + R0.h * bok[i][1] + Math.cos(vt * 0.045 + i * 2) * 18;
    const br = bok[i][2] * clamp(R0.w / 1200, 0.7, 1.3);
    const col = themeNow.ornaments[i % 6];
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, hexA(col, 0.085));
    g.addColorStop(0.65, hexA(col, 0.045));
    g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
  }
}

let grainPattern = null;
function buildGrain() {
  const tile = document.createElement('canvas');
  const s = CONFIG.grain.tile;
  tile.width = tile.height = s;
  const g = tile.getContext('2d');
  const grng = mulberry32(9001);
  for (let i = 0; i < s * 1.4; i++) {
    const x = grng() * s, y = grng() * s;
    const a = 0.20 + grng() * 0.55;
    g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    g.fillRect(x, y, 1, 1);
  }
  grainPattern = ctx.createPattern(tile, 'repeat');
}

function drawGrain(themeNow) {
  if (!grainPattern) return;
  const R0 = viewRect();
  ctx.save();
  ctx.globalAlpha = themeNow.grain;
  ctx.fillStyle = grainPattern;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
  ctx.restore();

  const g = ctx.createRadialGradient(
    R0.x + R0.w * 0.5, R0.y + R0.h * 0.46, Math.min(R0.w, R0.h) * 0.28,
    R0.x + R0.w * 0.5, R0.y + R0.h * 0.5, Math.max(R0.w, R0.h) * 0.78
  );
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = g;
  ctx.fillRect(R0.x, R0.y, R0.w, R0.h);
}

function updateThemeUI() {
  const dots = document.querySelectorAll('#themes .dot');
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === themeState.cur || i === themeState.pending);
    d.disabled = false;                 // 作画期间也可点，先记下目标主题
  });
  const autoBtn = document.getElementById('auto');
  autoBtn.classList.toggle('off', !themeState.auto);
  autoBtn.textContent = themeState.auto ? '自动换色' : '自动换色 已关';
}

function autoTick() {
  if (!themeState.auto || reduce) return;
  if (vt < CONFIG.totalDuration) return;
  if (nextSwitchAt === null) {
    nextSwitchAt = CONFIG.totalDuration + CONFIG.text.delay + CONFIG.text.writeEn + CONFIG.text.hold + CONFIG.theme.firstHold;
  }
  if (vt < nextSwitchAt) return;
  let next = (themeState.cur + 1) % THEMES.length;
  if (!caches[next] || !caches[next].ready) {
    nextSwitchAt = vt + 1.0;
    return;
  }
  startTransition(next);
  nextSwitchAt = vt + CONFIG.theme.every;
}

/* ============================================================
   11b. 围巾：真 3D 螺旋网格 + 针织贴图（整体重做）
   ============================================================ */
const SC = CONFIG.scarf;

const scarfState = {
  geo: null, items: new Map(), gen: 0,
  startT: 0, lastP: -1, bakeMs: 0, revealMs: 0
};

function scarfLayer(res) {
  const cv = document.createElement('canvas');
  const k = scale * dpr * res;
  cv.width = Math.max(1, Math.round(W * k));
  cv.height = Math.max(1, Math.round(H * k));
  const c = cv.getContext('2d');
  c.setTransform(k, 0, 0, k, 0, 0);
  return { cv: cv, ctx: c, k: k };
}

/* ---------- 几何 ---------- */
function scarfSurf(phi, y, u, fit, cosPhi, sagBase, envFn) {
  const e = envFn ? envFn(y) : envAt(y);
  const R = Math.max(6, e.half * fit + 1.6);
  const k = 0.20 - 0.08 * u;                 // 相机略俯视：底部 0.2 → 顶部 0.12
  const sag = sagBase * Math.pow(Math.max(0, cosPhi), 1.6);
  const wob = 0.8 * Math.sin(u * 12.4 + 1.9) + 0.35 * Math.sin(u * 29.0 + 0.4);
  let x = e.cx + R * Math.sin(phi);
  const ys = y + R * Math.cos(phi) * k + sag + wob * Math.sin(phi * 0.6 + 0.9);
  if (cosPhi > 0) {
    const lim = e.half * 0.99 + 2;
    if (Math.abs(x - e.cx) > lim) x = e.cx + Math.sign(x - e.cx) * lim;
  }
  return { x: x, y: ys, cos: cosPhi, cx: e.cx, half: e.half, R: R };
}

function scarfBuildGeo() {
  const { top, Ht } = G;
  const yBotC = top + Ht * 0.900;
  const yTopC = top + Ht * 0.058;
  const turns = SC.scarfTurns;
  const totalAng = turns * TAU;
  const step = SC.scarfSectionDeg * Math.PI / 180;
  const n = Math.round(totalAng / step);
  const phi0 = 80 * Math.PI / 180;

  // 更平滑的围巾专用轮廓（±20px 滑动平均），避免带边缘跟着针叶抖动
  const envPts = [];
  for (let y = G.top - 20; y <= G.yBot + 20; y += 4) {
    const e = envAt(y);
    envPts.push({ y: y, half: e.half, cx: e.cx });
  }
  const envSm = [];
  for (let i = 0; i < envPts.length; i++) {
    let a = 0, b = 0, n = 0;
    for (let k = -5; k <= 5; k++) {
      const q = envPts[i + k];
      if (!q) continue;
      a += q.half; b += q.cx; n++;
    }
    envSm.push({ y: envPts[i].y, half: a / n, cx: b / n });
  }
  const envFn = function (y) {
    if (y <= envSm[0].y) return envSm[0];
    const last = envSm[envSm.length - 1];
    if (y >= last.y) return last;
    for (let i = 0; i < envSm.length - 1; i++) {
      const a = envSm[i], b = envSm[i + 1];
      if (y >= a.y && y <= b.y) {
        const k = (y - a.y) / (b.y - a.y);
        return { half: a.half + (b.half - a.half) * k, cx: a.cx + (b.cx - a.cx) * k };
      }
    }
    return last;
  };

  const rings = [];
  for (let r = 0; r < turns; r++) {
    rings.push({ idx: r, len: 0, texLen: 0, texH: 0, wNom: SC.scarfWidthBottom + (SC.scarfWidthTop - SC.scarfWidthBottom) * ((r + 0.5) / turns) });
  }

  const secs = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const phi = phi0 + totalAng * u;
    const rBot = Math.min(turns - 1, Math.floor(u * turns));
    const fit = SC.scarfFit[Math.max(0, turns - 1 - rBot)];
    const wNom = SC.scarfWidthBottom + (SC.scarfWidthTop - SC.scarfWidthBottom) * u;
    const w = wNom * (1 + 0.02 * Math.sin(phi * 2.0 + 0.6));
    const cosPhi = Math.cos(phi);
    const sagBase = SC.scarfSagPx[0] + (SC.scarfSagPx[1] - SC.scarfSagPx[0]) * (1 - u);
    const yC = yBotC + (yTopC - yBotC) * u;
    const pT = scarfSurf(phi, yC - w * 0.5, u, fit, cosPhi, sagBase, envFn);
    const pB = scarfSurf(phi, yC + w * 0.5, u, fit, cosPhi, sagBase, envFn);
    secs.push({ u: u, phi: phi, cos: cosPhi, w: w, ring: rBot, uLocal: u * turns - rBot, pT: pT, pB: pB });
  }

  for (let i = 0; i < n; i++) {
    const a = secs[i], b = secs[i + 1];
    rings[a.ring].len += Math.hypot((b.pT.x + b.pB.x - a.pT.x - a.pB.x) * 0.5, (b.pT.y + b.pB.y - a.pT.y - a.pB.y) * 0.5);
  }

  const density = 1;
  let totalPx = 0;
  for (const r of rings) {
    r.len = Math.max(40, r.len);
    r.texLen = Math.max(64, Math.round(r.len * density));
    r.texH = Math.max(24, Math.round((r.wNom + 7) * density));
    totalPx += r.texLen * r.texH;
  }
  if (totalPx > 1500000) {
    const f = Math.sqrt(1500000 / totalPx);
    for (const r of rings) {
      r.texLen = Math.max(64, Math.round(r.texLen * f));
      r.texH = Math.max(24, Math.round(r.texH * f));
    }
  }

  const front = [], back = [];
  for (let i = 0; i < n; i++) {
    const a = secs[i], b = secs[i + 1];
    const c = (a.cos + b.cos) * 0.5;
    const ring = rings[a.ring];
    const midX = (a.pT.x + a.pB.x + b.pT.x + b.pB.x) * 0.25;
    const midY = (a.pT.y + a.pB.y + b.pT.y + b.pB.y) * 0.25;
    const e = envAt(midY);
    const tx = (midX - e.cx) / Math.max(24, e.half);
    const slice = {
      si: i, ring: a.ring, sx0: a.uLocal * ring.texLen, sx1: b.uLocal * ring.texLen,
      t0: a.pT, b0: a.pB, t1: b.pT, b1: b.pB,
      light: clamp(1.06 - 0.34 * tx * tx - 0.10 * tx, 0.55, 1.15),
      cos: c,
      alpha: clamp((c - 0.04) / 0.26, 0, 1)
    };
    (c > -0.08 ? front : back).push(slice);
  }

  // 尾巴：接最下圈起点
  const f0 = secs[0];
  const ax = (f0.pT.x + f0.pB.x) * 0.5;
  const ay = (f0.pT.y + f0.pB.y) * 0.5;
  const tailW = SC.scarfWidthBottom * 0.85;
  const wantLen = SC.scarfTailLength[1];
  const tailLen = Math.min(wantLen, Math.max(48, G.yBot - ay + 6));
  const tail = { x: ax, y: ay - 15, w: tailW, len: tailLen, phase: 1.7 };
  const tailBox = { x: ax - tailW * 1.1 - 14, y: ay - 34, w: tailW * 2.2 + 28, h: tailLen + 56 };

  // 压边针叶：绑到网格片
  const nr = mulberry32(CONFIG.seed + 4242);
  const needles = [];
  const maxN = Math.min(SC.scarfNeedlesMax, front.length);
  for (let k = 0; k < maxN; k++) {
    const si = Math.floor(nr() * front.length);
    const s = front[si];
    if (!s) continue;
    const edgeTop = nr() < 0.62;
    const edge = edgeTop ? s.t0 : s.b0;
    const tgx = (s.t1.x - s.t0.x), tgy = (s.t1.y - s.t0.y);
    const tl = Math.hypot(tgx, tgy) || 1;
    let nx = -tgy / tl, ny = tgx / tl;
    if (!edgeTop) { nx = -nx; ny = -ny; }
    if (ny < 0 && nr() < 0.7) { ny = -ny; }
    const len = 4 + nr() * 7;
    const jitter = (nr() - 0.5) * 4;
    needles.push({
      x: edge.x + tgx * 0.5 + nx * 1.2 + jitter,
      y: edge.y + tgy * 0.5 + ny * 1.2,
      x2: edge.x + tgx * 0.5 + nx * (1.2 + len) + jitter,
      y2: edge.y + tgy * 0.5 + ny * (1.2 + len),
      w: 1.5 + nr() * 2.0,
      c: Math.floor(nr() * 3),
      si: si
    });
  }

  scarfState.geo = {
    rings: rings, front: front, back: back, needles: needles,
    tail: tail, tailBox: tailBox, n: n, phi0: phi0, env: envSm,
    atlasPx: rings.reduce(function (s, r) { return s + r.texLen * r.texH; }, 0)
  };
}

/* ---------- 针织贴图 ---------- */
function scarfKnit(c, ring, base, light, dark, x0, x1, rowPx, colW, seed) {
  const rr = mulberry32(seed || 1);
  c.save();
  c.lineCap = 'round';
  for (let x = x0 - rowPx; x < x1; x += rowPx) {
    for (let ci = 0; ci < SC.scarfStitchCols; ci++) {
      const yc = (ci + 0.5) * colW;
      const j = (rr() - 0.5) * 0.08;
      const cw = Math.max(1.2, colW * 0.34);
      c.lineWidth = cw;
      c.strokeStyle = mix(base, light, clamp(0.50 + j * 1.6, 0, 0.92));
      c.beginPath();
      c.moveTo(x + rowPx * 0.10, yc - colW * 0.36);
      c.quadraticCurveTo(x + rowPx * 0.60, yc - colW * 0.10, x + rowPx * 0.93, yc);
      c.stroke();
      c.strokeStyle = mix(base, dark, clamp(0.46 + j * 1.6, 0, 0.9));
      c.beginPath();
      c.moveTo(x + rowPx * 0.12, yc + colW * 0.36);
      c.quadraticCurveTo(x + rowPx * 0.62, yc + colW * 0.10, x + rowPx * 0.93, yc);
      c.stroke();
      c.globalAlpha = 0.5;
      c.lineWidth = Math.max(0.6, colW * 0.06);
      c.strokeStyle = light;
      c.beginPath();
      c.moveTo(x + rowPx * 0.14, yc - colW * 0.39);
      c.quadraticCurveTo(x + rowPx * 0.62, yc - colW * 0.14, x + rowPx * 0.93, yc - colW * 0.02);
      c.stroke();
      c.globalAlpha = 1;
    }
    c.fillStyle = 'rgba(0,0,0,0.10)';
    c.fillRect(x + rowPx * 0.90, 0, Math.max(0.7, rowPx * 0.05), ring.texH);
  }
  c.restore();
}
function scarfBakeRingTexture(theme, ring) {
  const cv = document.createElement('canvas');
  cv.width = ring.texLen;
  cv.height = ring.texH;
  const c = cv.getContext('2d');
  const main = theme.ribbon[0];
  const light = theme.ribbonLight || theme.ribbon[1] || mix(main, '#ffffff', 0.4);
  const dark = theme.ribbonDark || shade(main, -0.35);
  const cream = theme.ribbonStripe || '#f4ead0';
  const s2 = theme.ribbonStripe2 || theme.ornaments[1];

  c.fillStyle = main;
  c.fillRect(0, 0, cv.width, cv.height);
  const rowPx = SC.scarfStitchRowPx * 1.6;
  const colW = cv.height / SC.scarfStitchCols;
  scarfKnit(c, ring, main, light, dark, 0, cv.width, rowPx, colW, CONFIG.seed + ring.idx * 977);

  // 条纹：每圈 2 组，织进针脚纹理
  const groups = [250, 305].slice(0, SC.scarfStripeGroups);
  for (const deg of groups) {
    const segs = [
      { w: 10, col: cream },
      { w: 5, col: null },
      { w: 4, col: s2 },
      { w: 5, col: null },
      { w: 10, col: cream }
    ];
    let x = (deg / 360) * cv.width - 17;
    for (const sg of segs) {
      if (sg.col) {
        c.save();
        c.beginPath();
        c.rect(x, 0, sg.w, cv.height);
        c.clip();
        c.fillStyle = sg.col;
        c.fillRect(x, 0, sg.w, cv.height);
        scarfKnit(c, ring, sg.col, mix(sg.col, '#ffffff', 0.5), shade(sg.col, -0.34),
          x - rowPx, x + sg.w + rowPx, rowPx, colW, CONFIG.seed + ring.idx * 131 + Math.round(deg));
        c.restore();
        c.strokeStyle = 'rgba(0,0,0,0.10)';
        c.lineWidth = 1;
        c.strokeRect(x + 0.5, 0.5, sg.w - 1, cv.height - 1);
      }
      x += sg.w;
    }
  }

  // 卷边：上亮下暗
  const gTop = c.createLinearGradient(0, 0, 0, 7);
  gTop.addColorStop(0, hexA(light, 0.72));
  gTop.addColorStop(0.45, hexA(light, 0.26));
  gTop.addColorStop(1, hexA(light, 0));
  c.fillStyle = gTop;
  c.fillRect(0, 0, cv.width, 7);
  const gBot = c.createLinearGradient(0, cv.height - 9, 0, cv.height);
  gBot.addColorStop(0, hexA(dark, 0));
  gBot.addColorStop(0.6, hexA(dark, 0.42));
  gBot.addColorStop(1, hexA(dark, 0.78));
  c.fillStyle = gBot;
  c.fillRect(0, cv.height - 9, cv.width, 9);

  // 体积感：圆管式横向明暗（上沿受光、中段过渡、下沿压暗）
  const gTone = c.createLinearGradient(0, 0, 0, cv.height);
  gTone.addColorStop(0, hexA(light, 0.78));
  gTone.addColorStop(0.10, hexA(light, 0.40));
  gTone.addColorStop(0.24, hexA(light, 0.02));
  gTone.addColorStop(0.42, hexA('#000000', 0.10));
  gTone.addColorStop(0.66, hexA('#000000', 0.26));
  gTone.addColorStop(0.86, hexA(dark, 0.44));
  gTone.addColorStop(1, hexA(dark, 0.80));
  c.fillStyle = gTone;
  c.fillRect(0, 0, cv.width, cv.height);

  // 一道柔和高光带（湿毛线的反光），位置偏上
  const gHi = c.createLinearGradient(0, cv.height * 0.12, 0, cv.height * 0.34);
  gHi.addColorStop(0, hexA(light, 0));
  gHi.addColorStop(0.5, hexA(light, 0.22));
  gHi.addColorStop(1, hexA(light, 0));
  c.fillStyle = gHi;
  c.fillRect(0, cv.height * 0.12, cv.width, cv.height * 0.22);

  // 不规则斜向褶皱，打散“平涂/传送带”感
  const cr = mulberry32(CONFIG.seed + ring.idx * 613 + 11);
  for (let i = 0; i < Math.floor(cv.width / 90); i++) {
    const x = cr() * cv.width;
    const wd = 10 + cr() * 26;
    c.globalAlpha = 0.06 + cr() * 0.05;
    c.fillStyle = cr() < 0.5 ? '#ffffff' : '#000000';
    c.beginPath();
    c.moveTo(x, 0);
    c.lineTo(x + wd, 0);
    c.lineTo(x + wd * 0.7 + cv.height * 0.18, cv.height);
    c.lineTo(x + cv.height * 0.18, cv.height);
    c.closePath();
    c.fill();
  }
  c.globalAlpha = 1;

  // 边缘描线：上亮下暗
  const gEdgeT = c.createLinearGradient(0, 0, 0, 7);
  gEdgeT.addColorStop(0, hexA(light, 0.55));
  gEdgeT.addColorStop(0.55, hexA(light, 0.16));
  gEdgeT.addColorStop(1, hexA(light, 0));
  c.fillStyle = gEdgeT;
  c.fillRect(0, 0, cv.width, 7);
  const gEdgeB = c.createLinearGradient(0, cv.height - 13, 0, cv.height);
  gEdgeB.addColorStop(0, hexA(dark, 0));
  gEdgeB.addColorStop(0.55, hexA(dark, 0.26));
  gEdgeB.addColorStop(1, hexA(dark, 0.62));
  c.fillStyle = gEdgeB;
  c.fillRect(0, cv.height - 13, cv.width, 13);

  // 毛料噪点：打破平涂感
  const nz = mulberry32(CONFIG.seed + ring.idx * 719 + 3);
  const nDots = Math.round(cv.width * cv.height / 70);
  for (let i = 0; i < nDots; i++) {
    const x = nz() * cv.width, y = nz() * cv.height;
    c.globalAlpha = 0.03 + nz() * 0.05;
    c.fillStyle = nz() < 0.55 ? '#ffffff' : '#000000';
    c.fillRect(x, y, 1 + (nz() < 0.3 ? 1 : 0), 1);
  }
  c.globalAlpha = 1;

  // 毛边
  if (SC.scarfFuzz) {
    const fr = mulberry32(CONFIG.seed + ring.idx * 331 + 7);
    const nHair = Math.floor(cv.width * 0.28);
    c.lineCap = 'round';
    for (let i = 0; i < nHair; i++) {
      const x = fr() * cv.width;
      const top = fr() < 0.62;
      const y = top ? 3.2 : cv.height - 3.2;
      const len = 1.4 + fr() * 2.4;
      c.globalAlpha = 0.16 + fr() * 0.12;
      c.strokeStyle = top ? light : dark;
      c.lineWidth = 0.7 + fr() * 0.6;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + (fr() - 0.5) * 2.4, top ? y - len : y + len);
      c.stroke();
    }
    c.globalAlpha = 1;
  }
  cv.m = 3;
  return cv;
}

/* ---------- 贴图映射 ---------- */
function scarfTexQuad(ctx, k, s, atl) {
  const dsw = Math.max(0.8, s.sx1 - s.sx0);
  const tx = (s.t1.x - s.t0.x + s.b1.x - s.b0.x) * 0.5;
  const ty = (s.t1.y - s.t0.y + s.b1.y - s.b0.y) * 0.5;
  const vx = (s.b0.x - s.t0.x + s.b1.x - s.t1.x) * 0.5;
  const vy = (s.b0.y - s.t0.y + s.b1.y - s.t1.y) * 0.5;
  const h = atl.height;
  const M = atl.m || 0;
  const hh = Math.max(4, h - M * 2);
  ctx.globalAlpha = s.alpha == null ? 1 : s.alpha;
  const sU = (dsw + 0.9) / dsw, sV = (hh + 1.2) / hh;
  const ox = s.t0.x - tx * 0.45 / dsw - vx * (M + 0.6) / hh;
  const oy = s.t0.y - ty * 0.45 / dsw - vy * (M + 0.6) / hh;
  ctx.setTransform(k * tx * sU / dsw, k * ty * sU / dsw, k * vx * sV / hh, k * vy * sV / hh, k * ox, k * oy);
  ctx.drawImage(atl, s.sx0, 0, dsw, h, 0, 0, dsw, h);
  ctx.globalAlpha = 1;
}

function scarfLightChunk(ctx, k, arr, from, to) {
  let sum = 0;
  for (let i = from; i < to; i++) sum += arr[i].light;
  const L = sum / Math.max(1, to - from);
  if (L > 0.995 && L < 1.005) return;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = L > 1 ? 'rgba(255,255,255,' + ((L - 1) * 0.55).toFixed(3) + ')'
                        : 'rgba(0,0,0,' + ((1 - L) * 0.42).toFixed(3) + ')';
  ctx.beginPath();
  const a = arr[from];
  ctx.moveTo(a.t0.x, a.t0.y);
  for (let i = from; i < to; i++) ctx.lineTo(arr[i].t1.x, arr[i].t1.y);
  for (let i = to - 1; i >= from; i--) ctx.lineTo(arr[i].b1.x, arr[i].b1.y);
  ctx.lineTo(a.b0.x, a.b0.y);
  ctx.closePath();
  ctx.fill();
}

/* ---------- 主题资源 ---------- */
function scarfItemFor(idx) {
  let it = scarfState.items.get(idx);
  if (it) return it;
  if (!scarfState.geo) return null;
  const t0 = performance.now();
  const theme = THEMES[idx];
  const front = scarfLayer(1);
  const back = scarfLayer(1);
  const shadow = scarfLayer(0.5);
  // 正面层裁到树的轮廓内（略外扩 2.5px），让带面在轮廓处自然被树遮住，而不是切出尖角
  if (scarfState.geo.env) {
    const c = front.ctx;
    c.setTransform(front.k, 0, 0, front.k, 0, 0);
    c.beginPath();
    const E = scarfState.geo.env, pad = 2.5;
    c.moveTo(E[0].cx - E[0].half - pad, E[0].y);
    for (let i = 1; i < E.length; i++) c.lineTo(E[i].cx - E[i].half - pad, E[i].y);
    for (let i = E.length - 1; i >= 0; i--) c.lineTo(E[i].cx + E[i].half + pad, E[i].y);
    c.closePath();
    c.clip();
  }
  const atlases = [];
  for (const ring of scarfState.geo.rings) atlases.push(scarfBakeRingTexture(theme, ring));
  const tb = scarfState.geo.tailBox;
  const tk = scale * dpr;
  const tailCv = document.createElement('canvas');
  tailCv.width = Math.max(1, Math.round(tb.w * tk));
  tailCv.height = Math.max(1, Math.round(tb.h * tk));
  const tailCtx = tailCv.getContext('2d');
  tailCtx.setTransform(tk, 0, 0, tk, 0, 0);
  it = {
    idx: idx, theme: theme, front: front, back: back, shadow: shadow,
    atlases: atlases, fF: 0, bB: 0, sS: 0, lc: 0,
    tail: { cv: tailCv, ctx: tailCtx, k: tk },
    shCol: hexA(shade(theme.treeShadow, -0.7), 0.62),
    shSoft: hexA(shade(theme.treeShadow, -0.5), 0.30),
    shThick: hexA(shade(theme.ribbonDark || theme.ribbon[0], -0.62), 0.62),
    backCol: hexA(shade(theme.ribbon[0], -0.68), 0.62)
  };
  scarfState.items.set(idx, it);
  scarfState.bakeMs = performance.now() - t0;

  const keep = [themeState.cur, idx];
  const tc = trans ? trans.to : -1;
  if (tc >= 0) keep.push(tc);
  for (const key of Array.from(scarfState.items.keys())) {
    if (keep.indexOf(key) < 0) scarfState.items.delete(key);
  }
  if (SC.debugScarf) console.log('[scarf] bake theme ' + idx + ' ' + scarfState.bakeMs.toFixed(1) + 'ms');
  return it;
}

/* ---------- 揭示 ---------- */
function scarfGrowP() {
  if (!scarfState.geo) return 0;
  return clamp((vt - scarfState.startT) / Math.max(0.4, SC.scarfGrowSeconds), 0, 1);
}

function scarfRevealItem(it, p) {
  const g = scarfState.geo;
  if (!g) return;
  const t0 = performance.now();
  const nG = p >= 1 ? g.n : Math.floor(g.n * p);
  let nF = 0;
  while (nF < g.front.length && g.front[nF].si < nG) nF++;
  if (it.fF < nF) {
    for (let i = it.fF; i < nF; i++) {
      const s = g.front[i];
      scarfTexQuad(it.front.ctx, it.front.k, s, it.atlases[s.ring]);
    }
    it.fF = nF;
  }
  const CH = 10;
  while ((it.lc + 1) * CH <= nF) {
    scarfLightChunk(it.front.ctx, it.front.k, g.front, it.lc * CH, (it.lc + 1) * CH);
    it.lc++;
  }
  const nS = nF;
  if (it.sS < nS) {
    for (let i = it.sS; i < nS; i++) {
      const s = g.front[i];
      scarfShadowQuad(it.shadow.ctx, it.shadow.k, s, it.shCol, 2.4, 8.0);
      scarfShadowQuad(it.shadow.ctx, it.shadow.k, s, it.shSoft, 3.6, 11.0);
      scarfShadowQuad(it.shadow.ctx, it.shadow.k, s, it.shThick, 0.7, 2.6);
    }
    it.sS = nS;
  }
  let nB = 0;
  while (nB < g.back.length && g.back[nB].si < nG) nB++;
  if (it.bB < nB) {
    for (let i = it.bB; i < nB; i++) {
      const s = g.back[i];
      scarfTexQuad(it.back.ctx, it.back.k, s, it.atlases[s.ring]);
      it.back.ctx.setTransform(it.back.k, 0, 0, it.back.k, 0, 0);
      it.back.ctx.fillStyle = it.backCol;
      it.back.ctx.beginPath();
      it.back.ctx.moveTo(s.t0.x, s.t0.y);
      it.back.ctx.lineTo(s.b0.x, s.b0.y);
      it.back.ctx.lineTo(s.b1.x, s.b1.y);
      it.back.ctx.lineTo(s.t1.x, s.t1.y);
      it.back.ctx.closePath();
      it.back.ctx.fill();
    }
    it.bB = nB;
  }
  scarfState.revealMs = performance.now() - t0;
}

function scarfShadowQuad(ctx, k, s, col, dx, dy) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(s.t0.x + dx, s.t0.y + dy);
  ctx.lineTo(s.b0.x + dx, s.b0.y + dy);
  ctx.lineTo(s.b1.x + dx, s.b1.y + dy);
  ctx.lineTo(s.t1.x + dx, s.t1.y + dy);
  ctx.closePath();
  ctx.fill();
}

/* ---------- 尾巴 ---------- */
function scarfDrawTail(it, alpha, grow) {
  grow = grow == null ? 1 : grow;
  const g = scarfState.geo;
  if (!g) return;
  const tb = g.tailBox;
  const c = it.tail.ctx;
  const k = it.tail.k;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, it.tail.cv.width, it.tail.cv.height);
  c.setTransform(k, 0, 0, k, 0, 0);
  c.translate(-tb.x, -tb.y);

  const th = it.theme;
  const main = th.ribbon[0];
  const light = th.ribbonLight || th.ribbon[1];
  const dark = th.ribbonDark || shade(main, -0.35);
  const cream = th.ribbonStripe || '#f4ead0';
  const s2 = th.ribbonStripe2 || th.ornaments[1];
  const T = g.tail;
  const swing = Math.sin(vt * 0.9 + T.phase) * 1.6 * Math.PI / 180;
  const w = T.w, L = T.len;

  c.save();
  c.translate(T.x, T.y);
  c.rotate(swing);
  c.beginPath();
  c.rect(-T.w * 1.4, -30, T.w * 2.8, 26 + (T.len + 26) * grow);
  c.clip();

  // 主体轮廓（略带垂坠收窄）
  function bodyPath() {
    c.beginPath();
    c.moveTo(-w * 0.5, -2);
    c.quadraticCurveTo(-w * 0.54, L * 0.42, -w * 0.43, L - 3);
    c.lineTo(w * 0.44, L);
    c.quadraticCurveTo(w * 0.54, L * 0.42, w * 0.5, -2);
    c.closePath();
  }

  // 尾布落在树上的投影
  c.save();
  c.translate(2.6, 4.6);
  c.globalAlpha = 0.38;
  c.fillStyle = shade(th.treeShadow || dark, -0.55);
  bodyPath();
  c.fill();
  c.restore();

  const gMain = c.createLinearGradient(-w * 0.5, 0, w * 0.55, 0);
  gMain.addColorStop(0, mix(main, light, 0.42));
  gMain.addColorStop(0.32, main);
  gMain.addColorStop(0.78, shade(main, -0.16));
  gMain.addColorStop(1, shade(main, -0.38));
  bodyPath();
  c.fillStyle = gMain;
  c.fill();

  // 针织纹理（V 针脚，不用横线）
  c.save();
  bodyPath();
  c.clip();
  const cols = 4;
  const colW = w / cols;
  const rowPx = 5;
  for (let y = 1; y < L; y += rowPx) {
    for (let i = 0; i < cols; i++) {
      const xc = -w * 0.5 + (i + 0.5) * colW;
      const shadeK = i === 0 ? 0.26 : (i === cols - 1 ? -0.16 : 0.04);
      c.lineCap = 'round';
      c.lineWidth = Math.max(1.1, colW * 0.2);
      c.strokeStyle = shadeK > 0 ? mix(main, light, shadeK) : shade(main, shadeK);
      c.beginPath();
      c.moveTo(xc - colW * 0.32, y);
      c.quadraticCurveTo(xc - colW * 0.05, y + rowPx * 0.55, xc, y + rowPx * 0.86);
      c.stroke();
      c.beginPath();
      c.moveTo(xc + colW * 0.32, y);
      c.quadraticCurveTo(xc + colW * 0.05, y + rowPx * 0.55, xc, y + rowPx * 0.86);
      c.stroke();
      c.globalAlpha = 0.34;
      c.lineWidth = 0.8;
      c.strokeStyle = mix(light, '#ffffff', 0.35);
      c.beginPath();
      c.moveTo(xc - colW * 0.34, y - 0.4);
      c.quadraticCurveTo(xc - colW * 0.05, y + rowPx * 0.3, xc - 0.4, y + rowPx * 0.62);
      c.stroke();
      c.globalAlpha = 1;
    }
    c.fillStyle = 'rgba(0,0,0,0.07)';
    c.fillRect(-w * 0.55, y + rowPx * 0.92, w * 1.1, 0.8);
  }

  // 织入的条纹（两道细条）
  for (const st of [{ y: L * 0.46, h: 4.5, col: cream }, { y: L * 0.56, h: 2.0, col: s2 }]) {
    c.globalAlpha = 0.95;
    c.fillStyle = st.col;
    c.fillRect(-w * 0.55, st.y, w * 1.1, st.h);
    c.globalAlpha = 0.25;
    c.fillStyle = '#000';
    c.fillRect(-w * 0.55, st.y + st.h, w * 1.1, 0.7);
    c.globalAlpha = 1;
  }

  // 左右明暗与卷边
  const gSide = c.createLinearGradient(-w * 0.5, 0, -w * 0.5 + 6, 0);
  gSide.addColorStop(0, hexA(light, 0.35));
  gSide.addColorStop(1, hexA(light, 0));
  c.fillStyle = gSide;
  c.fillRect(-w * 0.55, 0, 6, L + 2);
  const gSide2 = c.createLinearGradient(w * 0.5 - 7, 0, w * 0.5, 0);
  gSide2.addColorStop(0, hexA(dark, 0));
  gSide2.addColorStop(1, hexA(dark, 0.5));
  c.fillStyle = gSide2;
  c.fillRect(w * 0.5 - 7, 0, 7, L + 2);

  // 锁边缝线
  c.setLineDash([1.6, 1.6]);
  c.strokeStyle = hexA(light, 0.55);
  c.lineWidth = 0.8;
  bodyPath();
  c.stroke();
  c.setLineDash([]);
  c.restore();

  // 顶端折叠面（盖住接缝）
  c.fillStyle = mix(main, light, 0.3);
  c.beginPath();
  c.moveTo(-w * 0.62, -3);
  c.lineTo(w * 0.62, -3);
  c.lineTo(w * 0.55, 7);
  c.quadraticCurveTo(0, 9.5, -w * 0.56, 7);
  c.closePath();
  c.fill();
  c.strokeStyle = hexA(dark, 0.55);
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(-w * 0.56, 7);
  c.quadraticCurveTo(0, 9.5, w * 0.55, 7);
  c.stroke();

  // 流苏：每束 3 根拧紧的线
  const fringeN = SC.scarfFringeCount[0] + Math.round((SC.scarfFringeCount[1] - SC.scarfFringeCount[0]) * 0.4);
  c.lineCap = 'round';
  for (let i = 0; i < fringeN; i++) {
    const fx = -w * 0.40 + (i / Math.max(1, fringeN - 1)) * w * 0.80;
    const fl = 11 + (i % 4) * 2.0;
    const drift = Math.sin(i * 1.7 + 0.6) * 1.8;
    for (let q = 0; q < 3; q++) {
      c.strokeStyle = q === 0 ? mix(main, light, 0.45) : (q === 1 ? shade(main, -0.10) : shade(main, -0.36));
      c.lineWidth = 1.9;
      c.beginPath();
      c.moveTo(fx + (q - 1) * 0.9, L - 2);
      c.quadraticCurveTo(fx + (q - 1) * 1.8 + drift, L + fl * 0.55, fx + (q - 1) * 2.6 + drift, L + fl);
      c.stroke();
    }
  }
  c.restore();

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(it.tail.cv, tb.x, tb.y, tb.w, tb.h);
  ctx.restore();
}

/* ---------- 绘制 ---------- */
function scarfUpdateItems() {
  const p = scarfGrowP();
  if (p <= 0) return 0;
  const ids = trans ? [trans.from, trans.to] : [themeState.cur];
  for (const id of ids) {
    const it = scarfItemFor(id);
    if (it) scarfRevealItem(it, p);
  }
  scarfState.lastP = p;
  return p;
}

function scarfAlphaPair() {
  if (trans) {
    const p = easeInOut(clamp((vt - trans.t0) / trans.dur, 0, 1));
    return [{ idx: trans.from, a: 1 - p }, { idx: trans.to, a: p }];
  }
  return [{ idx: themeState.cur, a: 1 }];
}

function scarfBlit(kind) {
  const p = scarfUpdateItems();
  if (p <= 0) return;
  const pairs = scarfAlphaPair();
  for (const pr of pairs) {
    const it = scarfState.items.get(pr.idx);
    if (!it) continue;
    ctx.globalAlpha = pr.a;
    ctx.drawImage(it[kind].cv, 0, 0, W, H);
  }
  ctx.globalAlpha = 1;
}

function scarfDrawDynamic() {
  const p = scarfGrowP();
  if (p <= 0.02) return;
  const pairs = scarfAlphaPair();
  for (const pr of pairs) {
    const it = scarfState.items.get(pr.idx);
    if (it) scarfDrawTail(it, pr.a * clamp(p * 6, 0, 1), clamp((p - 0.03) / 0.20, 0, 1));
  }
  ctx.globalAlpha = 1;
}

function scarfDrawNeedles() {
  const p = scarfGrowP();
  if (p <= 0) return;
  const g = scarfState.geo;
  if (!g) return;
  const nG = p >= 1 ? g.n : Math.floor(g.n * p);
  if (nG <= 0) return;
  const th = currentTheme();
  const cols = [th.treeLight, th.treeHighlight, th.treeMid];
  ctx.globalAlpha = 0.9;
  for (const nd of g.needles) {
    if (nd.si >= nG) continue;
    ctx.strokeStyle = cols[nd.c];
    ctx.lineWidth = nd.w;
    ctx.beginPath();
    ctx.moveTo(nd.x, nd.y);
    ctx.lineTo(nd.x2, nd.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function scarfReleaseLayers() {
  scarfState.items.clear();
  scarfState.lastP = -1;
}

function scarfReset() {
  scarfState.gen++;
  for (const it of scarfState.items.values()) {
    for (const key of ['front', 'back', 'shadow']) {
      const L = it[key];
      L.ctx.setTransform(1, 0, 0, 1, 0, 0);
      L.ctx.clearRect(0, 0, L.cv.width, L.cv.height);
      L.ctx.setTransform(L.k, 0, 0, L.k, 0, 0);
    }
    it.fF = 0; it.bB = 0; it.sS = 0; it.lc = 0;
    it.tail.ctx.setTransform(1, 0, 0, 1, 0, 0);
    it.tail.ctx.clearRect(0, 0, it.tail.cv.width, it.tail.cv.height);
    it.tail.ctx.setTransform(it.tail.k, 0, 0, it.tail.k, 0, 0);
  }
  scarfState.lastP = -1;
}

function scarfInit() {
  scarfBuildGeo();
  let end = 0;
  for (const s of strokes) end = Math.max(end, s.start + s.dur);
  scarfState.startT = end + 0.1;
  scarfSelfCheck();
}

function scarfSelfCheck() {
  const g = scarfState.geo;
  if (!g) return;
  let maxOut = -999, thin = 1e9, worst = null;
  for (const s of g.front) {
    for (const p of [s.t0, s.b0, s.t1, s.b1]) {
      const e = envAt(p.y);
      const out = Math.abs(p.x - e.cx) - (e.half * 0.99 + 2.2);
      if (out > maxOut) { maxOut = out; worst = { x: p.x, y: p.y }; }
    }
    const wq = Math.hypot(s.b0.x - s.t0.x, s.b0.y - s.t0.y);
    thin = Math.min(thin, wq);
  }
  console.log('[scarf] turns=' + SC.scarfTurns + ' front=' + g.front.length + ' back=' + g.back.length +
    ' atlasPx=' + g.atlasPx + ' maxOut=' + maxOut.toFixed(2) + ' minBand=' + thin.toFixed(1) +
    ' start=' + scarfState.startT.toFixed(2) + 's');
  if (maxOut > 1) console.warn('[scarf] envelope overflow', worst);
}


function frame(ts) {
  const frameT0 = performance.now();
  if (!lastTs) lastTs = ts;
  let dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (document.hidden) dt = 0;          // 后台暂停，回到前台不追帧

  if (freezeT !== null) {
    vt = freezeT;
  } else if (!reduce) {
    vt += dt;
  } else {
    vt = CONFIG.totalDuration;
  }

  if (vt >= CONFIG.totalDuration && !doneOnce) {
    doneOnce = true;
    kickCaches();
    updateThemeUI();
  }
  if (themeState.pending != null && vt >= CONFIG.totalDuration) {
    const target = themeState.pending;
    themeState.pending = null;
    startTransition(target);
    updateThemeUI();
  }

  if (trans) {
    const p = (vt - trans.t0) / trans.dur;
    if (p >= 1) {
      trans = null;
      updateThemeUI();
      kickCaches();
    }
  }

  const themeNow = currentTheme();
  root.style.setProperty('--bg', themeNow.bg);

  if (vt < CONFIG.totalDuration) advanceStrokes();

  // 整屏底色 → 舞台整体等比缩放
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = themeNow.bg;
  ctx.fillRect(0, 0, VW, VH);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);

  drawBackground(themeNow);
  drawSnow(themeNow, true);
  scarfBlit('back');
  drawTreeLayer();
  drawMoundFront(themeNow);
  scarfBlit('shadow');
  scarfBlit('front');
  scarfDrawNeedles();
  scarfDrawDynamic();
  drawOrnaments(themeNow);
  drawLights(themeNow);
  drawTopStar(themeNow);
  drawSnow(themeNow, false);
  drawGrain(themeNow);
  drawSignature(themeNow);
  if (CONFIG.debugLayout) drawDebugOverlay(themeNow);
  if (qs.get('bench') === '1' && !window.__benchDone && vt > 10) {
    window.__benchDone = true;
    const it = scarfState.items.get(themeState.cur);
    if (it) {
      const N = 300, t0 = performance.now();
      for (let i = 0; i < N; i++) {
        ctx.drawImage(it.back.cv, 0, 0, W, H);
        ctx.drawImage(it.shadow.cv, 0, 0, W, H);
        ctx.drawImage(it.front.cv, 0, 0, W, H);
      }
      const blit = (performance.now() - t0) / N;
      const tailT0 = performance.now();
      for (let i = 0; i < 200; i++) scarfDrawTail(it, 1);
      const tailMs = (performance.now() - tailT0) / 200;
      document.title = 'BENCH bake=' + scarfState.bakeMs.toFixed(1) + 'ms blit3=' + blit.toFixed(3) +
        'ms tail=' + tailMs.toFixed(3) + 'ms atlas=' + it.atlases.map(a => a.width + 'x' + a.height).join(',');
    }
  }
  if (qs.get('atlas') === '1') {
    const it = scarfState.items.get(themeState.cur);
    const atl = it && it.atlases[0];
    if (atl) {
      ctx.save();
      ctx.drawImage(atl, 0, 0, 220, atl.height, 20, 20, 880, 880 * atl.height / 220);
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.fillText('atl ' + atl.width + 'x' + atl.height + '  rings ' + it.atlases.map(a => a.width + 'x' + a.height).join(' / ') + '  k ' + it.front.k.toFixed(3), 20, 240);
      ctx.restore();
    }
  }

  if (vt >= CONFIG.totalDuration) {
    if (freezeT === null) autoTick();
    if (!trans) pumpCaches(5);
  }

  // 帧耗时监测：只降级一次，避免抖动
  perf.frames++;
  const ms = performance.now() - frameT0;
  perf.avgMs = perf.avgMs ? perf.avgMs * 0.9 + ms * 0.1 : ms;
  if (perf.mode === 'on' && perf.level === 1 && ms > 24) {
    perf.slow = (perf.slow || 0) + 1;
    if (perf.slow >= 30) { perf.level = 2; applyPerfLevel(); }
  } else if (ms <= 24) {
    perf.slow = 0;
  }

  requestAnimationFrame(frame);
}

function drawDebugOverlay(themeNow) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,0,120,.85)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.font = '14px monospace';
  ctx.fillText('view ' + VW + 'x' + VH + '  scale ' + scale.toFixed(3) + '  dpr ' + dpr.toFixed(2), 14, 26);
  ctx.fillText('perf ' + (perf.mode === 'on' ? 'ON' : 'off') + '  level ' + perf.level + '  ' + perf.avgMs.toFixed(1) + 'ms', 14, 46);
  ctx.restore();
}


/* ============================================================
   12. 交互
   ============================================================ */
const replayBtn = document.getElementById('replay');
const skipBtn = document.getElementById('skip');
const autoBtn = document.getElementById('auto');
const themesBox = document.getElementById('themes');
const dockEl = document.getElementById('dock');
const toastEl = document.getElementById('toast');
const toastText = document.getElementById('toastText');
const undoBtn = document.getElementById('undo');

THEMES.forEach((t, i) => {
  const d = document.createElement('button');
  d.type = 'button';
  d.className = 'dot';
  d.style.setProperty('--dot', t.treeMid);
  d.title = t.name;
  d.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    wakeDock();
    if (vt < CONFIG.totalDuration) { themeState.pending = i; updateThemeUI(); return; }
    startTransition(i);
  });
  themesBox.appendChild(d);
});

autoBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  themeState.auto = !themeState.auto;
  if (themeState.auto) nextSwitchAt = vt + CONFIG.theme.manualHold;
  updateThemeUI();
});

skipBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  if (vt >= CONFIG.totalDuration) return;
  vt = CONFIG.totalDuration;
  fillScene();
  doneOnce = true;
  kickCaches();
  updateThemeUI();
});

replayBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  wakeDock();
  // 立刻执行；保留上一帧完成态供撤销
  undoSnapshot = { vt: vt, done: doneOnce };
  trans = null;
  vt = 0;
  doneOnce = false;
  nextSwitchAt = null;
  latterReset();
  scarfReset();
  showToast('已重新作画');
});

undoBtn.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  if (!undoSnapshot) return;
  vt = undoSnapshot.vt >= CONFIG.totalDuration ? CONFIG.totalDuration : CONFIG.totalDuration;
  trans = null;
  fillScene();
  doneOnce = true;
  kickCaches();
  updateThemeUI();
  hideToast();
});

let undoSnapshot = null;
let toastTimer = 0;
function showToast(text) {
  if (!toastEl) return;
  toastText.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), CONFIG.dock.undoToastMs);
}
function hideToast() {
  clearTimeout(toastTimer);
  if (toastEl) toastEl.classList.remove('show');
}

// dock 空闲淡出：手机上 5 秒无操作整体淡到 25%，任意触摸唤醒
let dockIdleTimer = 0;
function wakeDock() {
  themesBox.classList.remove('idle');
  controlsEl.classList.remove('idle');
  clearTimeout(dockIdleTimer);
  dockIdleTimer = setTimeout(() => {
    if (!isDockMobile()) return;
    themesBox.classList.add('idle');
    controlsEl.classList.add('idle');
  }, CONFIG.dock.dockIdleFade);
}
const controlsEl = document.getElementById('controls');
document.addEventListener('pointerdown', () => {
  wakeDock();
}, { passive: true });

function isDockMobile() {
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  return vw < CONFIG.dock.dockBreakpoint || vh < 500;
}

function latterReset() {
  sceneCtx.clearRect(0, 0, W, H);
  active.length = 0;
  cursor = 0;
  lastTs = 0;
  updateThemeUI();
}

let resizeTimer = 0;
function relayoutAll() {
  layout();                       // 只重算 scale / 画布尺寸，几何仍按固定舞台
  caches.length = 0;
  cacheQueue.length = 0;
  themeState.ready = false;
  trans = null;
  if (vt < CONFIG.totalDuration) vt = CONFIG.totalDuration;   // 重绘完成态，不重播动画
  fillScene();
  doneOnce = true;
  kickCaches();
  prepareText();
  scarfReleaseLayers();
  updateThemeUI();
}
function scheduleRelayout(delay) {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = Math.round(stage.clientWidth) || window.innerWidth;
    const h = Math.round(stage.clientHeight) || window.innerHeight;
    if (Math.abs(w - VW) < 2 && Math.abs(h - VH) < 2) return;  // 地址栏收缩等微小变化
    relayoutAll();
  }, delay || 150);
}
window.addEventListener('resize', () => scheduleRelayout(150));
window.addEventListener('orientationchange', () => scheduleRelayout(250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => scheduleRelayout(150));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastTs = 0;     // 回到前台重新对时，不追帧
});

/* ============================================================
   13. 启动
   ============================================================ */
const qs = new URLSearchParams(location.search);
const DBG = {
  w: parseFloat(qs.get('w')) || 0,
  h: parseFloat(qs.get('h')) || 0,
  dpr: parseFloat(qs.get('dpr')) || 0,
  t: qs.has('t') ? parseFloat(qs.get('t')) : null
};
let freezeT = (DBG.t !== null && isFinite(DBG.t)) ? clamp(DBG.t, 0, CONFIG.totalDuration) : null;
if (qs.has('theme')) themeState.cur = clamp(parseInt(qs.get('theme'), 10) || 0, 0, THEMES.length - 1);
if (qs.get('auto') === '0') themeState.auto = false;
if (qs.get('debug') === '1') CONFIG.debugLayout = true;
if (qs.get('debugScarf') === '1') CONFIG.scarf.debugScarf = true;
if (DBG.w || DBG.h) {
  document.body.classList.add('dbg-box');
  if (DBG.w) document.body.style.width = Math.round(DBG.w) + 'px';
  if (DBG.h) document.body.style.height = Math.round(DBG.h) + 'px';
}
detectPerf();
validateThemes();
layout();
if (qs.get('dump') === '1') setTimeout(() => { document.title = 'MC ' + JSON.stringify(window.__mc) + ' tt=' + document.title; }, 1200);
buildAll();
buildDynamic();
scarfInit();
prepareText();
buildGrain();
updateThemeUI();
if (reduce || freezeT !== null) {
  if (freezeT !== null) vt = freezeT; else vt = CONFIG.totalDuration;
  if (vt >= CONFIG.totalDuration) { fillScene(); doneOnce = true; kickCaches(); }
}
if (qs.has('vt')) {          // 调试：直接跳到某个时间点的完成态
  vt = clamp(parseFloat(qs.get('vt')) || CONFIG.totalDuration, 0, CONFIG.totalDuration);
  fillScene();
  doneOnce = true;
  kickCaches();
}
requestAnimationFrame(frame);

})();
</script>
</body>
